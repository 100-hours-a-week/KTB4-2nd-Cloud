# Yeodam V1 운영 Nginx 설정 (App EC2 Host)

upstream yeodam_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream yeodam_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# 80 → 443 리다이렉트 (+ 인증서 갱신용 ACME 경로)
server {
    listen 80;
    listen [::]:80;
    server_name yeodam-2gether.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 문법은 nginx 버전에 따라 다름. Ubuntu 24.04 기본(1.24)은 아래 형식.
    # 1.25.1+ 면 `listen 443 ssl;` + 별도 `http2 on;` 으로 바꿀 것. (nginx -v 로 확인)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yeodam-2gether.com;

    ssl_certificate     /etc/letsencrypt/live/yeodam-2gether.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yeodam-2gether.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 업로드 배치 상한 (설계: 요청당 약 150MB, 10장 단위)
    client_max_body_size 150m;

    # 공통 프록시 헤더 (모든 location 상속)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 기본 API 타임아웃 (아래 /api/trips 에서 개별 override)
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── BE /api/trips: 업로드(150m) + 여행 생성 동기 AI 대기(설계상 최대 373초, BE analysis_timeout 기본 30m) ──
    #    실제 생성이 30분 상한에 근접할 것 같으면 read timeout을 AI_ANALYSIS_TIMEOUT에 맞춰 상향.
    location /api/trips {
        proxy_pass http://yeodam_backend;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── 나머지 BE API ──
    # proxy_pass에 URI를 붙이지 않아 /api 경로를 그대로 Backend에 전달한다.
    location /api/ {
        proxy_pass http://yeodam_backend;
    }

    # ── 그 외 전부 FE (/, /login, /signup, /auth/*, /trips/create, /_next/*, 정적 자산) ──
    location / {
        proxy_pass http://yeodam_frontend;
    }
}
