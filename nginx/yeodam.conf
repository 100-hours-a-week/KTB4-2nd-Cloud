# Yeodam V1 운영 Nginx 설정 (App EC2 Host)

# Query String과 Cookie/Authorization Header는 기록하지 않는다.
# ID가 포함된 API 경로는 제한된 Route 이름으로 치환해 Logs Insights 집계의
# Cardinality를 제한하고 사용자 식별자가 Log Group에 남지 않게 한다.
map "$request_method:$uri" $yeodam_normalized_route {
    default                                      "other";

    "GET:/"                                      "/";
    "GET:/api/actuator/health"                   "/api/actuator/health";
    "GET:/api/auth/kakao/authorize"              "/api/auth/kakao/authorize";
    "GET:/api/auth/kakao/callback"               "/api/auth/kakao/callback";
    "GET:/api/auth/csrf"                         "/api/auth/csrf";
    "POST:/api/auth/token/exchange"              "/api/auth/token/exchange";
    "POST:/api/auth/token/refresh"               "/api/auth/token/refresh";
    "POST:/api/auth/logout"                      "/api/auth/logout";
    "GET:/api/users/me"                          "/api/users/me";
    "POST:/api/users/me/profile"                 "/api/users/me/profile";
    "DELETE:/api/users/me"                       "/api/users/me";
    "GET:/api/places"                            "/api/places";
    "POST:/api/trips"                            "/api/trips";
    "GET:/api/trips"                             "/api/trips";
    "GET:/api/trips/map"                         "/api/trips/map";
    "POST:/api/attachments/bulk-delete"          "/api/attachments/bulk-delete";
    "POST:/api/attachments/bulk-download"        "/api/attachments/bulk-download";

    ~^POST:/api/trips/[^/]+/initial-attachments$  "/api/trips/:tripId/initial-attachments";
    ~^POST:/api/trips/[^/]+/favorite$             "/api/trips/:tripId/favorite";
    ~^DELETE:/api/trips/[^/]+/favorite$           "/api/trips/:tripId/favorite";
    ~^GET:/api/trips/[^/]+/processing-status$     "/api/trips/:tripId/processing-status";
    ~^DELETE:/api/trips/[^/]+/processing$         "/api/trips/:tripId/processing";
    ~^GET:/api/trips/[^/]+/place-folders$         "/api/trips/:tripId/place-folders";
    ~^GET:/api/trips/[^/]+/place-folders/[^/]+/attachments$ "/api/trips/:tripId/place-folders/:tripPlaceId/attachments";
    ~^GET:/api/trips/[^/]+$                       "/api/trips/:tripId";
    ~^DELETE:/api/trips/[^/]+$                    "/api/trips/:tripId";
    ~^GET:/api/attachments/[^/]+/download$        "/api/attachments/:attachmentId/download";
    ~^GET:/api/attachments/[^/]+$                 "/api/attachments/:attachmentId";
    ~^DELETE:/api/attachments/[^/]+$              "/api/attachments/:attachmentId";

    ~^GET:/_next/                                 "/_next/*";
    ~^GET:/auth/                                  "/auth/*";
    ~^GET:/trips/                                 "/trips/*";
}

log_format yeodam_json escape=json
    '{'
      '"timestamp":"$time_iso8601",'
      '"request_id":"$request_id",'
      '"method":"$request_method",'
      '"normalized_route":"$yeodam_normalized_route",'
      '"status":$status,'
      '"request_length":$request_length,'
      '"bytes_sent":$bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_connect_time":"$upstream_connect_time",'
      '"upstream_response_time":"$upstream_response_time",'
      '"upstream_status":"$upstream_status",'
      '"release":"__YEODAM_RELEASE__"'
    '}';

access_log /var/log/nginx/yeodam-access.json yeodam_json;
error_log  /var/log/nginx/yeodam-error.log warn;

upstream yeodam_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream yeodam_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# 80 → 443 리다이렉트 (+ 인증서 갱신용 ACME 경로)
server {
    listen 80;
    listen [::]:80;
    server_name yeodam-2gether.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 문법은 nginx 버전에 따라 다름. Ubuntu 24.04 기본(1.24)은 아래 형식.
    # 1.25.1+ 면 `listen 443 ssl;` + 별도 `http2 on;` 으로 바꿀 것. (nginx -v 로 확인)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yeodam-2gether.com;

    ssl_certificate     /etc/letsencrypt/live/yeodam-2gether.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yeodam-2gether.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 업로드 배치 상한 (설계: 요청당 약 150MB, 10장 단위)
    client_max_body_size 150m;

    # 공통 프록시 헤더 (모든 location 상속)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # 기본 API 타임아웃 (아래 /api/trips 에서 개별 override)
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── BE /api/trips: 업로드(150m) + 여행 생성 동기 AI 대기(설계상 최대 373초, BE analysis_timeout 기본 30m) ──
    #    실제 생성이 30분 상한에 근접할 것 같으면 read timeout을 AI_ANALYSIS_TIMEOUT에 맞춰 상향.
    location /api/trips {
        proxy_pass http://yeodam_backend;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── 나머지 BE API ──
    # proxy_pass에 URI를 붙이지 않아 /api 경로를 그대로 Backend에 전달한다.
    location /api/ {
        proxy_pass http://yeodam_backend;
    }

    # ── 그 외 전부 FE (/, /login, /signup, /auth/*, /trips/create, /_next/*, 정적 자산) ──
    location / {
        proxy_pass http://yeodam_frontend;
    }
}
