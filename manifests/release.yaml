    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        yeodam.io/configuration-checksum: bc94a45ff1a94f14feb14fdc7f05605df51f0fbe3abe97212ca40a8d0223ba94
        yeodam.io/configuration-revision: 7adab0b8223c337d17c83dd488e68c68cdf1f6ab5603c42336f39f3ee07fca4b
        yeodam.io/image: ghcr.io/100-hours-a-week/yeodam-frontend@sha256:ce819e0e145795b7aafb171bf2a995c4c7b1d3c38fb79f89a211a693ae450cb2
      labels:
        app.kubernetes.io/component: frontend
        app.kubernetes.io/instance: frontend
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: yeodam
        yeodam.io/deployment-purpose: web
        yeodam.io/stage: v3
    spec:
      automountServiceAccountToken: false
      containers:
      - envFrom:
        - configMapRef:
            name: frontend-runtime
            optional: false
        image: ghcr.io/100-hours-a-week/yeodam-frontend@sha256:ce819e0e145795b7aafb171bf2a995c4c7b1d3c38fb79f89a211a693ae450cb2
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /login
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        name: frontend
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /login
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            ephemeral-storage: 256Mi
            memory: 512Mi
          requests:
            cpu: 100m
            ephemeral-storage: 32Mi
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /login
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /tmp
          name: scratch
        - mountPath: /app/.next/cache
          name: next-cache
      imagePullSecrets:
      - name: ghcr-pull
      nodeSelector:
        yeodam.io/role: api
        yeodam.io/stage: v3
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: frontend
      terminationGracePeriodSeconds: 60
      tolerations:
      - effect: NoSchedule
        key: yeodam.io/role
        operator: Equal
        value: api
      volumes:
      - emptyDir:
          sizeLimit: 128Mi
        name: next-cache
      - emptyDir:
          sizeLimit: 64Mi
        name: scratch
