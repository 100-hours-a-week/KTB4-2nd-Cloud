data:
  health.py: "\"\"\"API event-loop liveness tolerates dependency503; runner Ready\
    \ is status, not a claim gate.\"\"\"\nimport os,sys,urllib.request,urllib.error\n\
    from pathlib import Path\n\ndef api_live():\n    try:\n        with urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)\
    \ as r:return r.status==200\n    except urllib.error.HTTPError as e:\n       \
    \ try:return e.code==503\n        finally:e.close()\n\ndef runner_ready():\n \
    \   from reference_data import tourapi_ready\n    if not tourapi_ready():return\
    \ False\n    from redis import Redis\n    path=Path(os.environ['PLACE_INDEX_PATH'])\n\
    \    if not path.is_file() or not Path('/tmp/place-index-ready').is_file():return\
    \ False\n    with path.open('rb') as f:\n        if f.read(16)!=b'SQLite format\
    \ 3\\x00':return False\n    with Redis.from_url(os.environ['REDIS_URL'],socket_connect_timeout=2,socket_timeout=2)\
    \ as r:return bool(r.ping())\nif __name__=='__main__':\n    try:ok=api_live()\
    \ if sys.argv[1]=='api-live' else runner_ready()\n    except Exception:ok=False\n\
    \    raise SystemExit(0 if ok else 1)\n"
  prepare-trust.py: "\"\"\"Merge public roots only; no application secrets or network\
    \ calls.\"\"\"\nfrom pathlib import Path\nimport ssl\nroots=Path('/etc/ssl/certs/ca-certificates.crt').read_bytes()\n\
    for name in ['redis','qdrant','kafka']:\n    ca=Path('/etc/yeodam/ca',name+'.crt').read_bytes()\n\
    \    if b'PRIVATE KEY' in ca:raise SystemExit('Public certificates only')\n  \
    \  roots+=b'\\n'+ca\nssl.create_default_context(cadata=roots.decode())\nPath('/etc/yeodam/trust/ca-bundle.pem').write_bytes(roots)\n"
  reference_data.py: "\"\"\"Prepare TourAPI before Ready/claiming; old images remain\
    \ usable with opt-in disabled.\"\"\"\nimport os\nfrom pathlib import Path\n\n\
    SIZE = 34351861\nMARKER = Path('/tmp/tourapi-ready')\n\ndef prepare_tourapi(cfg):\n\
    \    MARKER.unlink(missing_ok=True)\n    if os.environ.get('CLOUD_TOURAPI_ENABLED')\
    \ != '1':\n        return\n    if not getattr(cfg, 'PROCESS_WORKFLOW_ENABLED',\
    \ False):\n        raise RuntimeError('TourAPI requires workflow support in the\
    \ selected image')\n    from app.pipeline.workflow.resources import prepare_tour_raw\n\
    \    path = prepare_tour_raw(cfg)  # Existing atomic download, checksum and JSON\
    \ validation.\n    if path is None or path != Path(os.environ['TOURAPI_RAW_PATH'])\
    \ or path.stat().st_size != SIZE:\n        raise RuntimeError('TourAPI reference\
    \ not ready')\n    MARKER.write_text(os.environ['TOURAPI_RAW_SHA256'])\n    print(f'TourAPI\
    \ ready: bytes={SIZE}', flush=True)\n\ndef tourapi_ready():\n    if os.environ.get('CLOUD_TOURAPI_ENABLED')\
    \ != '1':\n        return True\n    path = Path(os.environ['TOURAPI_RAW_PATH'])\n\
    \    return (path.is_file() and path.stat().st_size == SIZE and MARKER.is_file()\n\
    \            and MARKER.read_text() == os.environ['TOURAPI_RAW_SHA256'])\n"
  runpod_control.py: "\"\"\"Cloud process adapter: stop new claims, finish current\
    \ work, resume on lease expiry.\n\nNo AI repository changes. Wrap the existing\
    \ runner_loop with its supported stop Event;\nnever cancel active work to perform\
    \ a URL update. State is local, temporary and public.\n\"\"\"\nimport asyncio\n\
    import hashlib\nimport json\nimport os\nimport re\nimport sys\nimport time\nfrom\
    \ pathlib import Path\n\nDIRECTORY = Path('/tmp/yeodam-runpod-control')\nLEASE\
    \ = DIRECTORY / 'lease.json'\nSTATE = DIRECTORY / 'state.json'\nSOURCE = Path('/var/run/yeodam-vlm/base-url')\n\
    PROTOCOL = 1\n\n\ndef atomic(path, data):\n    path.parent.mkdir(mode=0o700, parents=True,\
    \ exist_ok=True)\n    temporary = path.with_suffix('.' + str(os.getpid()) + '.tmp')\n\
    \    temporary.write_text(json.dumps(data))\n    temporary.chmod(0o600)\n    temporary.replace(path)\n\
    \n\ndef lease():\n    try:\n        value = json.loads(LEASE.read_text())\n  \
    \      if re.fullmatch('[a-f0-9]{32}', value['operation']) and time.time() < value['expires']\
    \ <= time.time() + 3601:\n            return value\n    except (OSError, ValueError,\
    \ KeyError, TypeError):\n        pass\n    return None\n\n\nclass Control:\n \
    \   def __init__(self, expected):\n        self.expected = expected\n        self.loops\
    \ = {}\n        self.http = 0\n        self.monitor_task = None\n\n    async def\
    \ monitor(self):\n        while True:\n            current = lease()\n       \
    \     if current:\n                for stop, _ in self.loops.values():\n     \
    \               stop.set()\n            atomic(STATE, {'protocol': PROTOCOL, 'operation':\
    \ current['operation'] if current else None,\n                           'draining':\
    \ bool(current), 'idle': bool(current) and len(self.loops) == self.expected\n\
    \                           and all(done for _, done in self.loops.values()) and\
    \ self.http == 0,\n                           'loops': len(self.loops), 'activeHttp':\
    \ self.http})\n            await asyncio.sleep(.2)\n\n    def start(self):\n \
    \       if self.monitor_task is None:\n            self.monitor_task = asyncio.create_task(self.monitor())\n\
    \n    def wrap(self, original):\n        async def controlled(store, kind, stop=None):\n\
    \            self.start()\n            key = object()\n            try:\n    \
    \            while stop is None or not stop.is_set():\n                    local\
    \ = asyncio.Event()\n                    self.loops[key] = (local, bool(lease()))\n\
    \                    while lease():\n                        if stop is not None\
    \ and stop.is_set():\n                            return\n                   \
    \     await asyncio.sleep(.2)\n                    local = asyncio.Event()\n \
    \                   self.loops[key] = (local, False)\n                    async\
    \ def stop_parent():\n                        while not local.is_set():\n    \
    \                        if lease() or (stop is not None and stop.is_set()):\n\
    \                                local.set()\n                            await\
    \ asyncio.sleep(.1)\n                    watch = asyncio.create_task(stop_parent())\n\
    \                    try:\n                        await original(store, kind,\
    \ local)\n                    finally:\n                        watch.cancel()\n\
    \                        await asyncio.gather(watch, return_exceptions=True)\n\
    \                    self.loops[key] = (local, True)\n                    if stop\
    \ is not None and stop.is_set():\n                        return\n           \
    \         # Keep the supervisor alive while drained; Kubernetes must not\n   \
    \                 # restart it automatically before the update controller decides.\n\
    \                    if not local.is_set():\n                        raise RuntimeError('AI\
    \ loop returned without a drain request')\n            finally:\n            \
    \    self.loops.pop(key, None)\n        return controlled\n\n    def middleware(self,\
    \ application):\n        async def controlled(scope, receive, send):\n       \
    \     if scope['type'] != 'http' or scope.get('path') in {'/health', '/metrics'}:\n\
    \                return await application(scope, receive, send)\n            if\
    \ lease():\n                await send({'type': 'http.response.start', 'status':\
    \ 503,\n                            'headers': [(b'content-type', b'application/json'),\
    \ (b'retry-after', b'30')]})\n                return await send({'type': 'http.response.body',\
    \ 'body': b'{\"error\":\"model_maintenance\"}'})\n            self.http += 1\n\
    \            try:\n                await application(scope, receive, send)\n \
    \           finally:\n                self.http -= 1\n        return controlled\n\
    \n\ndef install(expected):\n    from app.jobs import runner\n    control = Control(expected)\n\
    \    runner.runner_loop = control.wrap(runner.runner_loop)\n    return control\n\
    \n\ndef cli():\n    action = sys.argv[1]\n    if action == 'drain':\n        operation,\
    \ ttl = sys.argv[2], int(sys.argv[3])\n        assert re.fullmatch('[a-f0-9]{32}',\
    \ operation) and 30 <= ttl <= 3600\n        current = lease()\n        assert\
    \ current is None or current['operation'] == operation\n        atomic(LEASE,\
    \ {'operation': operation, 'expires': time.time() + ttl})\n        result = {'requested':\
    \ True}\n    elif action == 'resume':\n        current = lease()\n        if current:\n\
    \            assert current['operation'] == sys.argv[2]\n            LEASE.unlink()\n\
    \        result = {'resumed': True}\n    elif action == 'status':\n        result\
    \ = json.loads(STATE.read_text())\n        current = lease()\n        if not current\
    \ or current['operation'] != result.get('operation'):\n            result.update(idle=False,\
    \ draining=False)\n        else:\n            result['leaseRemainingSeconds']\
    \ = int(current['expires'] - time.time())\n    elif action == 'source':\n    \
    \    result = {'sourceMatches': hashlib.sha256(SOURCE.read_bytes().strip()).hexdigest()\
    \ == sys.argv[2]}\n    elif action == 'environment':\n        result = {'environmentMatches':\
    \ hashlib.sha256(os.environ['VLM_BASE_URL'].encode()).hexdigest() == sys.argv[2],\
    \ 'modelMatches': os.environ['VLM_MODEL'] == 'gemma-4'}\n    elif action == 'verify':\n\
    \        import urllib.request\n        url = os.environ['VLM_BASE_URL']\n   \
    \     assert hashlib.sha256(url.encode()).hexdigest() == sys.argv[2]\n       \
    \ assert re.fullmatch(r'https://[a-z0-9]+-8000\\.proxy\\.runpod\\.net/v1', url)\n\
    \        # Match the deployed AI client identification; the default urllib agent\
    \ is rejected upstream.\n        request = urllib.request.Request(url + '/models',\
    \ headers={'Authorization': 'Bearer ' + os.environ['VLM_API_KEY'], 'User-Agent':\
    \ 'python-httpx/0.28.1'})\n        # No redirects: never send the authorization\
    \ to a different endpoint.\n        class NoRedirect(urllib.request.HTTPRedirectHandler):\n\
    \            def redirect_request(self, *args, **kwargs): return None\n      \
    \  with urllib.request.build_opener(NoRedirect()).open(request, timeout=20) as\
    \ response:\n            data = json.loads(response.read(1024 * 1024))\n     \
    \   result = {'environmentMatches': True,\n                  'modelReady': any(x.get('id')\
    \ == os.environ['VLM_MODEL'] for x in data.get('data', []))}\n    else:\n    \
    \    raise ValueError('Unknown bounded control action')\n    print(json.dumps(result))\n\
    \n\nif __name__ == '__main__':\n    try:\n        cli()\n    except Exception:\n\
    \        raise SystemExit('AI control failed; sensitive output suppressed') from\
    \ None\n"
  sitecustomize.py: "\"\"\"Bounded HTTP tracing only; no model import, payload logging\
    \ or command replacement.\"\"\"\nimport os\nimport sys\n\n# Management probes\
    \ and maintenance CLI must keep their existing lightweight behavior.\n_skip =\
    \ any(x.endswith((\"health.py\", \"runpod_control.py\", \"prepare-trust.py\"))\
    \ for x in getattr(sys, \"orig_argv\", sys.argv))\nif os.environ.get(\"YEODAM_APM_ENABLED\"\
    ) == \"true\" and not _skip:\n    try:\n        from opentelemetry import trace\n\
    \        from opentelemetry.sdk.resources import Resource\n        from opentelemetry.sdk.trace\
    \ import TracerProvider\n        from opentelemetry.sdk.trace.sampling import\
    \ ParentBased, TraceIdRatioBased\n        from opentelemetry.sdk.trace.export\
    \ import BatchSpanProcessor\n        from opentelemetry.exporter.otlp.proto.http.trace_exporter\
    \ import OTLPSpanExporter\n        from opentelemetry.instrumentation.fastapi\
    \ import FastAPIInstrumentor\n        from opentelemetry.instrumentation.httpx\
    \ import HTTPXClientInstrumentor\n        from opentelemetry.propagate import\
    \ set_global_textmap\n        from opentelemetry.trace.propagation.tracecontext\
    \ import TraceContextTextMapPropagator\n        provider = TracerProvider(resource=Resource.create({\n\
    \            \"service.name\": os.environ[\"OTEL_SERVICE_NAME\"], \"service.namespace\"\
    : \"ai\",\n            \"service.version\": os.environ[\"OTEL_SERVICE_VERSION\"\
    ], \"deployment.environment.name\": \"production\",\n        }), sampler=ParentBased(TraceIdRatioBased(0.01)))\n\
    \        provider.add_span_processor(BatchSpanProcessor(\n            OTLPSpanExporter(endpoint=os.environ[\"\
    OTEL_EXPORTER_OTLP_ENDPOINT\"]+\"/v1/traces\", timeout=1),\n            max_queue_size=128,\
    \ max_export_batch_size=32, schedule_delay_millis=1000, export_timeout_millis=1000))\n\
    \        trace.set_tracer_provider(provider)\n        set_global_textmap(TraceContextTextMapPropagator())\n\
    \        FastAPIInstrumentor().instrument(excluded_urls=r\".*/(health|metrics)(?:\\\
    ?.*)?$\")\n        HTTPXClientInstrumentor().instrument()\n    except Exception\
    \ as error:\n        # Telemetry setup must not prevent the original app from\
    \ starting. CI rejects this condition.\n        print('{\"event\":\"cloud_apm_initialization_failed\"\
    ,\"error_type\":\"'+type(error).__name__+'\"}', file=sys.stderr, flush=True)\n"
  start-api.py: "\"\"\"Use the unchanged AI image with Cloud's reversible maintenance\
    \ adapter.\"\"\"\nimport os\nimport uvicorn\nfrom runpod_control import install\n\
    \ncontrol = install(int(os.environ['JOBS_STORY_CONCURRENCY']))\nfrom app.v2_main\
    \ import create_app\n\nif __name__ == '__main__':\n    uvicorn.run(control.middleware(create_app()),\
    \ host='0.0.0.0', port=8000, timeout_graceful_shutdown=35)\n"
  start-runner.py: "\"\"\"Prepare the existing index, then run the controlled process\
    \ loop; never load a GPU model here.\"\"\"\nimport os,sys,asyncio,signal\nfrom\
    \ pathlib import Path\nfrom app.jobs.config import JobsSettings\nfrom app.infra.place_index\
    \ import prepare_place_index\nfrom reference_data import prepare_tourapi\nPath('/tmp/place-index-ready').unlink(missing_ok=True)\n\
    Path('/tmp/tourapi-ready').unlink(missing_ok=True)\ncfg=JobsSettings()\npath=prepare_place_index(cfg)\n\
    if path is None or path.stat().st_size!=1098801152:raise SystemExit('Reference\
    \ index not ready')\nprepare_tourapi(cfg)\nPath('/tmp/place-index-ready').write_text(cfg.PLACE_INDEX_SHA256)\n\
    print('Place index ready: bytes=1098801152',flush=True)\nfrom runpod_control import\
