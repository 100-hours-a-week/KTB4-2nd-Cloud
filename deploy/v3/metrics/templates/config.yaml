{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata: {name: v3-metrics-config, namespace: observability}
data:
  prometheus.yaml: |
{{ .Files.Get "files/prometheus.yaml" | indent 4 }}
{{- if .Values.aiMetricsEnabled }}
      - job_name: ai
        metrics_path: /metrics
        static_configs: [{targets: ['ai-api.ai.svc:8000']}]
        authorization: {type: Bearer, credentials_file: /etc/prometheus/ai-auth/API_KEY}
        metric_relabel_configs:
          - {source_labels: [__name__], regex: 'yeodam_ai_operation_duration_seconds_(bucket|count|sum)|yeodam_ai_jobs|yeodam_ai_job_peak_memory_bytes|yeodam_ai_photos_total|yeodam_ai_story_blocks_total', action: keep}
        sample_limit: 3000
        label_limit: 30
{{- end }}
{{- if .Values.apmEnabled }}
      - job_name: apm-alloy
        static_configs: [{targets: ['v3-alloy:12345']}]
        metric_relabel_configs:
          - {source_labels: [__name__], regex: 'otelcol_.*spans(_total)?|otelcol_exporter_queue_(size|capacity)|process_start_time_seconds|process_resident_memory_bytes', action: keep}
        sample_limit: 1000
      - job_name: apm-tempo
        static_configs: [{targets: ['v3-tempo:3200']}]
        metric_relabel_configs:
          - {source_labels: [__name__], regex: 'tempo_distributor_.*|tempo_live_store_.*|tempo_discarded_(spans|bytes)_total|tempo_receiver_.*|process_start_time_seconds|process_resident_memory_bytes', action: keep}
        sample_limit: 1000
{{- end }}
{{- if .Values.autoscalingMetricsEnabled }}
      - job_name: keda
        static_configs: [{targets: ['keda-operator.keda.svc:8080']}]
        metric_relabel_configs:
          - {source_labels: [__name__], regex: 'keda_scaler_metrics_value|keda_scaler_errors_total|keda_scaled_object_errors_total', action: keep}
        sample_limit: 1000
{{- end }}
  alerts.yaml: |
{{ .Files.Get "files/alerts.yaml" | indent 4 }}
{{- if .Values.outboxEnabled }}
{{ (regexReplaceAll "^groups:\n" (.Files.Get "files/outbox-alerts.yaml") "") | indent 4 }}
{{- end }}
{{- if .Values.apmEnabled }}
{{ (regexReplaceAll "^groups:\n" (.Files.Get "files/apm-alerts.yaml") "") | indent 4 }}
{{- end }}
  outbox.sql: |
{{ .Files.Get "files/outbox.sql" | indent 4 }}
  outbox-query.sh: |
{{ .Files.Get "files/outbox-query.sh" | indent 4 }}
  outbox-metrics.py: |
{{ .Files.Get "files/outbox-metrics.py" | indent 4 }}
  cdc-status.py: |
{{ .Files.Get "files/cdc-status.py" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: v3-grafana-config, namespace: observability}
data:
  datasource.yaml: |
{{ .Files.Get "files/datasource.yaml" | indent 4 }}
{{- if .Values.apmEnabled }}
      - name: Tempo
        uid: v3-tempo
        type: tempo
        access: proxy
        url: http://v3-tempo:3200
        editable: false
{{- end }}
{{- if .Values.cloudwatchLogsEnabled }}
      - name: V3 CloudWatch Logs
        uid: v3-cloudwatch-logs
        type: cloudwatch
        access: proxy
        editable: false
        jsonData:
          authType: default
          defaultRegion: ap-northeast-2
          logGroups:
            - {name: /yeodam/v3/production/ai-api, arn: 'arn:aws:logs:ap-northeast-2:483175530259:log-group:/yeodam/v3/production/ai-api'}
            - {name: /yeodam/v3/production/ai-runner, arn: 'arn:aws:logs:ap-northeast-2:483175530259:log-group:/yeodam/v3/production/ai-runner'}
            - {name: /yeodam/v3/production/backend, arn: 'arn:aws:logs:ap-northeast-2:483175530259:log-group:/yeodam/v3/production/backend'}
{{- end }}
  dashboard-provider.yaml: |
{{ .Files.Get "files/dashboard-provider.yaml" | indent 4 }}
  operations.json: |
{{ .Files.Get "files/operations.json" | indent 4 }}
{{- if .Values.apmEnabled }}
  apm.json: |
{{ .Files.Get "files/apm.json" | indent 4 }}
{{- end }}
{{- end }}

{{- if and .Values.enabled .Values.outboxEnabled }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: v3-outbox-dashboard, namespace: observability}
data:
  outbox.json: |
{{ .Files.Get "files/outbox.json" | indent 4 }}
{{- end }}
