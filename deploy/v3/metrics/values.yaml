# No resources until explicitly enabled after merge and runtime prerequisites.
enabled: false
aiMetricsEnabled: true

# Activate after the APM backend is installed.
apmEnabled: false

# Enable after its dedicated Pod Identity and log groups are ready.
cloudwatchLogsEnabled: false

# Supply a dedicated SELECT-only client.cnf and CA before opt-in.
outboxEnabled: false
autoscalingMetricsEnabled: false
