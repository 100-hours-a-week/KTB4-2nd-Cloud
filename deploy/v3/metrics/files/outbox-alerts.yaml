groups:
  - name: v3-outbox-observation
    rules:
      - alert: V3OutboxObservationUnavailable
        expr: (yeodam_outbox_probe_success == 0) or absent(yeodam_outbox_probe_success) or (time() - yeodam_outbox_last_success_timestamp_seconds > 65)
        for: 1m
        labels: {severity: warning}
        annotations: {summary: Outbox observation missing or stale; recovery cannot be inferred}
      - alert: V3OutboxPendingTooOld
        expr: (yeodam_outbox_oldest_pending_age_seconds{outbox!="attachment_conversion_outbox"} > 120) and on(job,instance) (yeodam_outbox_probe_success == 1)
        for: 1m
        labels: {severity: warning}
        annotations: {summary: Unconfirmed CDC-managed publication older than provisional 120s threshold}
      - alert: V3OutboxCountCapped
        expr: yeodam_outbox_count_capped == 1
        labels: {severity: warning}
        annotations: {summary: Outbox count is a lower bound at 10001; do not report an exact backlog}
      - alert: V3ConversionDeliveryStalled
        expr: (yeodam_conversion_outbox_oldest_pending_age_seconds{category="active"} > 30) and on(job,instance) (yeodam_outbox_probe_success == 1) and on(job,instance) (time() - yeodam_outbox_last_success_timestamp_seconds <= 65)
        for: 15s
        labels: {severity: warning}
        annotations: {summary: Active conversion work has unconfirmed publication older than provisional 30s threshold}
      - alert: V3ConversionOutboxResidue
        expr: (yeodam_conversion_outbox_oldest_pending_age_seconds{category=~"succeeded|canceled|failed"} > 120) and on(job,instance) (yeodam_outbox_probe_success == 1)
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Terminal conversion task retains an unconfirmed receipt; inspect consistency, not active CDC recovery"}
      - alert: V3ConversionOutboxUnknownTask
        expr: (yeodam_conversion_outbox_pending{category="unknown"} > 0) and on(job,instance) (yeodam_outbox_probe_success == 1)
        for: 15s
        labels: {severity: warning}
        annotations: {summary: Unconfirmed conversion receipt has missing or unknown task state; do not infer healthy}
