{{- range $instance, $workload := .Values.workloads }}
{{- $c := mergeOverwrite (deepCopy $.Values.defaults) $workload }}
{{- if and $c.enabled $c.service.enabled }}
{{- $ctx := dict "root" $ "instance" $instance "config" $c }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $instance }}
  namespace: {{ $c.namespace }}
  labels:
    {{- include "yeodam-v3-apps.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "yeodam-v3-apps.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
