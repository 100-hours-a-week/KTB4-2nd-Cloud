{{- range $instance, $workload := .Values.workloads }}
{{- $c := include "yeodam-v3-apps.resolveConfig" (dict "root" $ "instance" $instance "workload" $workload) | fromYaml }}
{{- if and $c.enabled (not (and $.Values.frontendContract $.Values.frontendServiceOnly)) }}
{{- $apm := has $instance $.Values.apmWorkloads }}
{{- $apmConfig := fromJson ($.Files.Get "files/apm.json") }}
{{- if and $apm (not $.Values.backendContract) }}{{ fail "APM may instrument only reviewed backend profiles" }}{{ end }}
{{- $ctx := dict "root" $ "instance" $instance "config" $c }}
{{- include "yeodam-v3-apps.check" $ctx }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $instance }}
  namespace: {{ $c.namespace }}
  labels:
    {{- include "yeodam-v3-apps.labels" $ctx | nindent 4 }}
spec:
  {{- if not (has $instance $.Values.autoscaledWorkloads) }}
  replicas: {{ $c.replicas }}
  {{- end }}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ $c.rollout.maxSurge }}
      maxUnavailable: {{ $c.rollout.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "yeodam-v3-apps.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yeodam-v3-apps.labels" $ctx | nindent 8 }}
      annotations:
        yeodam.io/image: {{ index $.Values.images $c.imageRef | quote }}
        yeodam.io/configuration-revision: {{ $c.configurationRevision | quote }}
        {{- if $c.configMapData }}
        yeodam.io/configuration-checksum: {{ $c.configMapData | toJson | sha256sum | quote }}
        {{- end }}
    spec:
      {{- if and (eq $instance "photo-converter") (has $instance $.Values.autoscaledWorkloads) }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app.kubernetes.io/instance: photo-converter}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      serviceAccountName: {{ $c.serviceAccountName }}
      nodeSelector:
        {{- toYaml $c.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml $c.tolerations | nindent 8 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $c.security.runAsUser }}
        runAsGroup: {{ $c.security.runAsGroup }}
        fsGroup: {{ $c.security.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        {{- range $c.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- if $.Values.websocketContract }}
      initContainers:
        - name: prepare-trust
          image: {{ index $.Values.images $c.imageRef | quote }}
          command: [/bin/sh, -ec]
          args:
            - |
{{ $.Files.Get "files/prepare-websocket-trust.sh" | indent 14 }}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: trust-input, mountPath: /etc/yeodam/ca, readOnly: true}
            - {name: truststore, mountPath: /etc/yeodam/trust}
            - {name: scratch, mountPath: /tmp}
      {{- end }}
      {{- if eq $c.name "backend" }}
      initContainers:
        {{- if $.Values.backendConnectionContract }}
        - name: prepare-trust
          image: {{ index $.Values.images $c.imageRef | quote }}
          command: [/bin/sh, -ec]
          args:
            - |
{{ $.Files.Get "files/prepare-trust.sh" | indent 14 }}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: trust-input, mountPath: /etc/yeodam/ca, readOnly: true}
            - {name: truststore, mountPath: /etc/yeodam/trust}
            - {name: scratch, mountPath: /tmp}
        {{- end }}
        - name: seed-catalog
          image: {{ index $.Values.images $c.imageRef | quote }}
          command: ["cp", "-R", "/app/data/.", "/catalog/"]
          securityContext:
            {{- include "yeodam-v3-apps.containerSecurity" . | nindent 12 }}
          resources:
            requests:
              cpu: {{ $c.resources.requests.cpu | quote }}
              memory: {{ $c.resources.requests.memory | quote }}
              ephemeral-storage: {{ index $c.resources.requests "ephemeral-storage" | quote }}
            limits:
              memory: {{ $c.resources.limits.memory | quote }}
              ephemeral-storage: {{ index $c.resources.limits "ephemeral-storage" | quote }}
              {{- if $c.resources.limits.cpu }}
              cpu: {{ $c.resources.limits.cpu | quote }}
              {{- end }}
          volumeMounts:
            - name: catalog
              mountPath: /catalog
        {{- if $apm }}
        - name: prepare-apm
          image: {{ $apmConfig.javaImage }}
          command: [cp, /javaagent.jar, /otel/javaagent.jar]
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: apm, mountPath: /otel}]
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $c.name }}
          image: {{ index $.Values.images $c.imageRef | quote }}
          securityContext:
            {{- include "yeodam-v3-apps.containerSecurity" . | nindent 12 }}
          ports:
            {{- range $portName, $port := $c.ports }}
            - name: {{ $portName }}
              containerPort: {{ $port }}
              protocol: TCP
            {{- end }}
          resources:
            requests:
              cpu: {{ $c.resources.requests.cpu | quote }}
              memory: {{ $c.resources.requests.memory | quote }}
              ephemeral-storage: {{ index $c.resources.requests "ephemeral-storage" | quote }}
            limits:
              memory: {{ $c.resources.limits.memory | quote }}
              ephemeral-storage: {{ index $c.resources.limits "ephemeral-storage" | quote }}
              {{- if $c.resources.limits.cpu }}
              cpu: {{ $c.resources.limits.cpu | quote }}
              {{- end }}
          {{- if or $c.configMapRefs $c.configMapData }}
          envFrom:
            {{- if $c.configMapData }}
            - configMapRef:
                name: {{ $instance }}-runtime
                optional: false
            {{- end }}
            {{- range $c.configMapRefs }}
            - configMapRef:
                name: {{ . }}
                optional: false
            {{- end }}
          {{- end }}
          {{- if or $c.environment $c.secretRefs }}
          env:
            {{- range $key, $value := $c.environment }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $secret := $c.secretRefs }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret.name }}
                  key: {{ $secret.key }}
                  optional: false
            {{- end }}
            {{- if $apm }}
            - {name: JAVA_TOOL_OPTIONS, value: {{ printf "%s -javaagent:/otel/javaagent.jar" $c.configMapData.JAVA_TOOL_OPTIONS | quote }}}
            - {name: OTEL_SERVICE_NAME, value: {{ $instance | quote }}}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: {{ printf "service.namespace=%s,deployment.environment.name=production,service.version=%s" $c.namespace $c.configMapData.RELEASE | quote }}}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ $apmConfig.endpoint | quote }}}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf}
            - {name: OTEL_TRACES_SAMPLER, value: {{ $apmConfig.sampler | quote }}}
            - {name: OTEL_TRACES_SAMPLER_ARG, value: {{ $apmConfig.samplerArg | quote }}}
            - {name: OTEL_PROPAGATORS, value: tracecontext}
            - {name: OTEL_METRICS_EXPORTER, value: none}
            - {name: OTEL_LOGS_EXPORTER, value: none}
            - {name: OTEL_BSP_MAX_QUEUE_SIZE, value: '128'}
            - {name: OTEL_BSP_MAX_EXPORT_BATCH_SIZE, value: '32'}
            - {name: OTEL_BSP_SCHEDULE_DELAY, value: '1000'}
            - {name: OTEL_EXPORTER_OTLP_TIMEOUT, value: '1000'}
            {{- end }}
          {{- end }}
          startupProbe:
            {{- toYaml $c.probes.startup | nindent 12 }}
          livenessProbe:
            {{- toYaml $c.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml $c.probes.readiness | nindent 12 }}
          {{- if $c.preStopDelaySeconds }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $c.preStopDelaySeconds }}
          {{- end }}
          volumeMounts:
            - name: scratch
              mountPath: /tmp
            {{- if $.Values.frontendContract }}
            - {name: next-cache, mountPath: /app/.next/cache}
            {{- end }}
            {{- if or $.Values.backendConnectionContract $.Values.websocketContract }}
            - {name: truststore, mountPath: /etc/yeodam/trust, readOnly: true}
            {{- end }}
            {{- if eq $c.name "backend" }}
            - name: catalog
              mountPath: /app/data
            {{- end }}
            {{- range $c.secretVolumes }}
            - name: {{ .name }}
              mountPath: {{ .mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if $apm }}
            - {name: apm, mountPath: /otel, readOnly: true}
            {{- end }}
      volumes:
        {{- if $.Values.frontendContract }}
        - name: next-cache
          emptyDir: {sizeLimit: 128Mi}
        {{- end }}        {{- if or $.Values.backendConnectionContract $.Values.websocketContract }}
        - name: truststore
          emptyDir: {sizeLimit: 4Mi}
        {{- end }}
        - name: scratch
          emptyDir:
            sizeLimit: {{ $c.scratchSizeLimit | quote }}
        {{- if eq $c.name "backend" }}
        - name: catalog
          emptyDir:
            sizeLimit: {{ $c.catalogSizeLimit | quote }}
        {{- end }}
        {{- range $c.secretVolumes }}
        - name: {{ .name }}
          secret:
            secretName: {{ .secretName }}
            optional: false
            defaultMode: 0440
        {{- end }}
        {{- if $apm }}
        - {name: apm, emptyDir: {sizeLimit: 48Mi}}
        {{- end }}
{{- end }}
{{- end }}
