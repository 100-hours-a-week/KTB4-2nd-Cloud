{{- if .Values.enabled }}
{{- range $kind := list "bootstrap" "smoke" }}
{{- if index $.Values $kind }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-{{ $kind }}
  namespace: mysql
  labels:
    {{- include "mysql.labels" $ | nindent 4 }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "mysql.labels" $ | nindent 8 }}
        yeodam.io/mysql-process: {{ $kind }}
    spec:
      serviceAccountName: mysql
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector: {yeodam.io/role: data, yeodam.io/memory-tier: 4gi}
      tolerations:
        - {key: yeodam.io/role, operator: Equal, value: data, effect: NoSchedule}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $kind }}
          image: {{ $.Values.image }}
          command: [/bin/bash, /runtime/{{ $kind }}.sh]
          env:
            - {name: PRIMARY_MEMBER, value: {{ $.Values.primaryMember | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: credentials, mountPath: /credentials, readOnly: true}
            - {name: credentials, mountPath: /tls, readOnly: true}
            {{- range $path, $_ := $.Files.Glob "files/*" }}
            - {name: runtime, mountPath: /runtime/{{ base $path }}, subPath: {{ base $path }}, readOnly: true}
            {{- end }}
      volumes:
        - {name: runtime, configMap: {name: mysql-runtime, defaultMode: 0444}}
        - {name: credentials, secret: {secretName: mysql-bootstrap, defaultMode: 0440}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
{{- end }}
{{- end }}
{{- end }}
