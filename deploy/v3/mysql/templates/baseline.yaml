{{- if and (not .Values.enabled) (or .Values.bootstrap .Values.smoke) }}{{ fail "Jobs require enabled MySQL" }}{{ end }}
apiVersion: v1
kind: Namespace
metadata:
  name: mysql
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: mysql
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: mysql
spec:
  podSelector:
    matchLabels:
      {{- include "mysql.selector" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mysql-peers
  namespace: mysql
spec:
  podSelector:
    matchLabels:
      {{- include "mysql.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "mysql.selector" . | nindent 14 }}
      ports: [{protocol: TCP, port: 3306}]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "mysql.selector" . | nindent 14 }}
      ports: [{protocol: TCP, port: 3306}]
