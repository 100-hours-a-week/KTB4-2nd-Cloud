stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: '0.0.0.0:4317'}
storage:
  trace:
    backend: local
    wal: {path: /var/tempo/wal}
    local: {path: /var/tempo/blocks}
backend_worker:
  compaction:
    block_retention: 24h
    compaction_window: 1h
    max_block_bytes: 33554432
    retention_concurrency: 1
overrides:
  defaults:
    compaction: {block_retention: 24h}
    ingestion:
      rate_limit_bytes: 16384
      burst_size_bytes: 2097152
      max_traces_per_user: 16
    global:
      max_bytes_per_trace: 1048576
usage_report: {reporting_enabled: false}
