{{- range $namespace, $config := .Values.namespaces }}
{{- range $instance, $workload := $config.workloads }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $instance }}
  namespace: {{ $namespace }}
  labels:
    {{- include "yeodam-v3-platform.workloadLabels" (dict "instance" $instance "workload" $workload) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
