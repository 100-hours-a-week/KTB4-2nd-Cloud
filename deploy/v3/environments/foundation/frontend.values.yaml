# FE only; disabled until an image and source are reviewed.
frontendContract: true
defaults:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 32Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 256Mi
  imagePullSecrets:
  - ghcr-pull
  configMapData:
    NODE_ENV: production
    HOSTNAME: 0.0.0.0
    PORT: '3000'
    NEXT_TELEMETRY_DISABLED: '1'
    NODE_OPTIONS: --max-old-space-size=256
    SERVER_API_BASE_URL: https://v3.yeodam-2gether.com/api
    RELEASE: ''
  probes:
    startup:
      httpGet:
        path: /login
        port: http
        scheme: HTTP
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
      successThreshold: 1
    liveness:
      httpGet:
        path: /login
        port: http
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
    readiness:
      httpGet:
        path: /login
        port: http
        scheme: HTTP
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
  terminationGracePeriodSeconds: 60
  preStopDelaySeconds: 5
  rollout:
    maxSurge: 0
    maxUnavailable: 1
  scratchSizeLimit: 64Mi
  configurationRevision: ''
workloads:
  frontend:
    replicas: 1
    ports:
      http: 3000
    service:
      enabled: true
      port: 3000
    security:
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
