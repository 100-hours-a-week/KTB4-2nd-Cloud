stores:
  mongodb:
    enabled: true
    roleArn: arn:aws:iam::483175530259:role/yeodam-v3-foundation-eso-mongodb
    secrets:
      - name: mongodb-bootstrap
        data:
          - secretKey: admin-password
            remoteKey: yeodam/v3/foundation/mongodb/bootstrap
            property: adminPassword
          - secretKey: app-password
            remoteKey: yeodam/v3/foundation/mongodb/bootstrap
            property: appPassword
          - secretKey: health-password
            remoteKey: yeodam/v3/foundation/mongodb/bootstrap
            property: healthPassword
          - secretKey: ca.crt
            remoteKey: yeodam/v3/foundation/mongodb/bootstrap
            property: tlsCa
          - secretKey: tls.crt
            remoteKey: yeodam/v3/foundation/mongodb/bootstrap
            property: tlsCert
          - secretKey: tls.key
            remoteKey: yeodam/v3/foundation/mongodb/bootstrap
            property: tlsKey
