# Retains the complete existing MySQL bootstrap binding.
stores:
  mysql:
    enabled: true
    roleArn: arn:aws:iam::483175530259:role/yeodam-v3-foundation-eso-mysql
    secrets:
    - name: mysql-bootstrap
      data:
      - secretKey: root-password
        remoteKey: yeodam/v3/foundation/mysql/bootstrap
        property: rootPassword
      - secretKey: admin-password
        remoteKey: yeodam/v3/foundation/mysql/bootstrap
        property: adminPassword
      - secretKey: app-password
        remoteKey: yeodam/v3/foundation/mysql/bootstrap
        property: appPassword
      - secretKey: replication-password
        remoteKey: yeodam/v3/foundation/mysql/bootstrap
        property: replicationPassword
      - secretKey: health-password
        remoteKey: yeodam/v3/foundation/mysql/bootstrap
        property: healthPassword
      - secretKey: ca.crt
        remoteKey: yeodam/v3/foundation/mysql/bootstrap
        property: tlsCa
      - secretKey: tls.crt
        remoteKey: yeodam/v3/foundation/mysql/bootstrap
        property: tlsCert
      - secretKey: tls.key
        remoteKey: yeodam/v3/foundation/mysql/bootstrap
        property: tlsKey
    - name: mysql-cdc
      data:
      - secretKey: username
        remoteKey: yeodam/v3/foundation/mysql/cdc
        property: username
      - secretKey: password
        remoteKey: yeodam/v3/foundation/mysql/cdc
        property: password
