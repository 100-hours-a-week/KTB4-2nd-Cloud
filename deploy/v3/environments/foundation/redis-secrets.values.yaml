stores:
  redis:
    enabled: true
    roleArn: arn:aws:iam::483175530259:role/yeodam-v3-foundation-eso-redis
    secrets:
      - name: redis-bootstrap
        data:
          - secretKey: admin-password
            remoteKey: yeodam/v3/foundation/redis/bootstrap
            property: adminPassword
          - secretKey: app-password
            remoteKey: yeodam/v3/foundation/redis/bootstrap
            property: appPassword
          - secretKey: replication-password
            remoteKey: yeodam/v3/foundation/redis/bootstrap
            property: replicationPassword
          - secretKey: monitor-password
            remoteKey: yeodam/v3/foundation/redis/bootstrap
            property: monitorPassword
          - secretKey: sentinel-peer-password
            remoteKey: yeodam/v3/foundation/redis/bootstrap
            property: sentinelPeerPassword
          - secretKey: sentinel-client-password
            remoteKey: yeodam/v3/foundation/redis/bootstrap
            property: sentinelClientPassword
          - secretKey: health-password
            remoteKey: yeodam/v3/foundation/redis/bootstrap
            property: healthPassword
          - secretKey: ca.crt
            remoteKey: yeodam/v3/foundation/redis/bootstrap
            property: tlsCa
          - secretKey: tls.crt
            remoteKey: yeodam/v3/foundation/redis/bootstrap
            property: tlsCert
          - secretKey: tls.key
            remoteKey: yeodam/v3/foundation/redis/bootstrap
            property: tlsKey
