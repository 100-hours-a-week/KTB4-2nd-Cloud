    enabled: true
    roleArn: arn:aws:iam::483175530259:role/yeodam-v3-foundation-eso-kafka
    secrets:
      - name: mysql-cdc
        data:
          - {secretKey: username, remoteKey: yeodam/v3/foundation/mysql/cdc, property: username}
