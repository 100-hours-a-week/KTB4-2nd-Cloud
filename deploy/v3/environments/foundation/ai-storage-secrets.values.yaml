stores:
  ai-redis:
    enabled: true
    roleArn: arn:aws:iam::483175530259:role/yeodam-v3-foundation-eso-ai-redis
    secrets:
    - name: ai-redis-bootstrap
      data:
      - secretKey: ca.crt
        remoteKey: yeodam/v3/foundation/ai-redis/bootstrap
        property: tlsCa
      - secretKey: tls.crt
        remoteKey: yeodam/v3/foundation/ai-redis/bootstrap
        property: tlsCert
      - secretKey: tls.key
        remoteKey: yeodam/v3/foundation/ai-redis/bootstrap
        property: tlsKey
      - secretKey: app-password
        remoteKey: yeodam/v3/foundation/ai-redis/bootstrap
        property: appPassword
      - secretKey: admin-password
        remoteKey: yeodam/v3/foundation/ai-redis/bootstrap
        property: adminPassword
      - secretKey: health-password
        remoteKey: yeodam/v3/foundation/ai-redis/bootstrap
        property: healthPassword
  qdrant:
    enabled: true
    roleArn: arn:aws:iam::483175530259:role/yeodam-v3-foundation-eso-qdrant
    secrets:
    - name: qdrant-bootstrap
      data:
      - secretKey: ca.crt
        remoteKey: yeodam/v3/foundation/qdrant/bootstrap
        property: tlsCa
      - secretKey: tls.crt
        remoteKey: yeodam/v3/foundation/qdrant/bootstrap
        property: tlsCert
      - secretKey: tls.key
        remoteKey: yeodam/v3/foundation/qdrant/bootstrap
        property: tlsKey
      - secretKey: api-key
        remoteKey: yeodam/v3/foundation/qdrant/bootstrap
        property: apiKey
