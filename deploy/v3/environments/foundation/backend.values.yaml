# Full BE image in five roles; disabled until dependencies, TLS and Secrets are ready.
# Topic/Group names follow the BE handoff. Kafka cluster endpoint isolates V3.
backendContract: true
images:
  backend: ''
defaults:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 1Gi
      ephemeral-storage: 512Mi
  imagePullSecrets:
  - ghcr-pull
  environment: {}
  configMapRefs: []
  configMapData:
    SPRING_PROFILES_ACTIVE: prod,internal-metrics
    MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
    SERVER_SHUTDOWN: graceful
    SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 60s
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50.0 -XX:InitialRAMPercentage=12.5
    VIPS_CONCURRENCY: '1'
    MYSQL_URL: ''
    REDIS_HOST: ''
    REDIS_PORT: '6379'
    KAFKA_BOOTSTRAP_SERVERS: ''
    ATTACHMENT_S3_BUCKET: ''
    AWS_REGION: ap-northeast-2
    AI_SERVER_BASE_URL: ''
    AI_EC2_INSTANCE_ID: ''
    JWT_ISSUER: ''
    FRONTEND_ORIGIN: ''
    FRONTEND_OAUTH_CALLBACK_URI: ''
    KAKAO_REDIRECT_URI: ''
    AUTH_SESSION_KEY_PREFIX: 'yeodam:v3:foundation:auth:'
    WEBSOCKET_EVENTS_CHANNEL: yeodam:v3:foundation:websocket:events:v1
    KAFKA_TRIP_UPDATE_RESULT_CONSUMER_GROUP: yeodam-trip-update-results
    ATTACHMENT_CONVERSION_MODE: KAFKA
    RELEASE: ''
    KAFKA_TRIP_CREATE_REQUEST_TOPIC: prod.yeodam.trip-create.request
    KAFKA_TRIP_CREATE_RESULT_TOPIC: prod.yeodam.trip-create.result
    KAFKA_TRIP_UPDATE_REQUEST_TOPIC: prod.yeodam.trip-update.request
    KAFKA_TRIP_UPDATE_RESULT_TOPIC: prod.yeodam.trip-update.result
    KAFKA_STORY_CREATE_REQUEST_TOPIC: prod.yeodam.story-create.request
    KAFKA_STORY_CREATE_RESULT_TOPIC: prod.yeodam.story-create.result
    ATTACHMENT_CONVERSION_GROUP_PREFIX: prod.yeodam.image-conversion
    ATTACHMENT_CONVERSION_TECHNICAL_BACKOFF: 3s
    ATTACHMENT_CONVERSION_RECOVERY_INTERVAL: 60s
    ATTACHMENT_CONVERSION_RECOVERY_PAGE_SIZE: '10'
    ATTACHMENT_CONVERSION_RECOVERY_MAX_PAGES_PER_RUN: '2'
    ATTACHMENT_CONVERSION_RECOVERY_MAX_REISSUES_PER_RUN: '5'
    ATTACHMENT_CONVERSION_FETCH_MAX_BYTES: '1048576'
    ATTACHMENT_CONVERSION_PARTITION_FETCH_MAX_BYTES: '524288'
    ATTACHMENT_CONVERSION_MAX_MESSAGE_BYTES: '262144'
    ATTACHMENT_CONVERSION_INITIAL_LIGHT_TOPIC: prod.yeodam.image.initial-light
    ATTACHMENT_CONVERSION_INITIAL_HEIC_TOPIC: prod.yeodam.image.initial-heic
    ATTACHMENT_CONVERSION_ADDITIONAL_LIGHT_TOPIC: prod.yeodam.image.additional-light
    ATTACHMENT_CONVERSION_ADDITIONAL_HEIC_TOPIC: prod.yeodam.image.additional-heic
    ATTACHMENT_CONVERSION_DLT_TOPIC: prod.yeodam.image.conversion-dlt
  secretRefs:
    MYSQL_USERNAME:
      name: backend-credentials
      key: MYSQL_USERNAME
    MYSQL_PASSWORD:
      name: backend-credentials
      key: MYSQL_PASSWORD
    JWT_SECRET:
      name: backend-credentials
      key: JWT_SECRET
    KAKAO_CLIENT_ID:
      name: backend-credentials
      key: KAKAO_CLIENT_ID
    KAKAO_CLIENT_SECRET:
      name: backend-credentials
      key: KAKAO_CLIENT_SECRET
    AI_SERVER_API_KEY:
      name: backend-credentials
      key: AI_SERVER_API_KEY
    WEBSOCKET_INTERNAL_SERVICE_TOKEN:
      name: backend-credentials
      key: WEBSOCKET_INTERNAL_SERVICE_TOKEN
    MONGODB_URI:
      name: backend-credentials
      key: MONGODB_URI
  probes:
    startup:
      httpGet:
        path: /actuator/health/liveness
        port: management
        scheme: HTTP
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 60
      successThreshold: 1
    liveness:
      httpGet:
        path: /actuator/health/liveness
        port: management
        scheme: HTTP
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
    readiness:
      httpGet:
        path: /actuator/health/readiness
        port: management
        scheme: HTTP
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
  terminationGracePeriodSeconds: 180
  preStopDelaySeconds: 5
  rollout:
    maxSurge: 1
    maxUnavailable: 0
  scratchSizeLimit: 256Mi
  catalogSizeLimit: 32Mi
  configurationRevision: ''
  springProperties:
    app:
      trip:
        result-listener-enabled: false
        result-consumer-group: prod.yeodam-trip-results
      story:
        result-consumer-group: prod.yeodam-story-results
      outbox:
        receipt-consumer-group: prod.yeodam-outbox-receipts
        receipt-listener-enabled: false
      attachment-conversion:
        admission:
          max-unfinished-photos:
            LIGHT: 100
            HEIC: 50
          max-unfinished-bytes:
            LIGHT: 1572864000
            HEIC: 786432000
          max-unfinished-age: 5m
          sample-interval: 5s
          snapshot-max-age: 15s
          reopen-ratio: 0.5
        operations:
          enabled: false
workloads:
  auth-api:
    configMapData:
      ATTACHMENT_CONVERSION_CONSUMER_ENABLED: 'false'
      ATTACHMENT_CONVERSION_RECEIPT_LISTENER_ENABLED: 'false'
      ATTACHMENT_CONVERSION_RECOVERY_ENABLED: 'false'
      TRIP_RESULT_WORKER_ENABLED: 'false'
      TRIP_STATUS_POLLING_ENABLED: 'false'
      STORY_RESULT_LISTENER_ENABLED: 'false'
      STORY_STATUS_POLLING_ENABLED: 'false'
  trip-api:
    configMapData:
      ATTACHMENT_CONVERSION_CONSUMER_ENABLED: 'false'
      ATTACHMENT_CONVERSION_RECEIPT_LISTENER_ENABLED: 'false'
      ATTACHMENT_CONVERSION_RECOVERY_ENABLED: 'false'
      TRIP_RESULT_WORKER_ENABLED: 'false'
      TRIP_STATUS_POLLING_ENABLED: 'false'
      STORY_RESULT_LISTENER_ENABLED: 'false'
      STORY_STATUS_POLLING_ENABLED: 'false'
  photo-api:
    configMapData:
      ATTACHMENT_CONVERSION_CONSUMER_ENABLED: 'false'
      ATTACHMENT_CONVERSION_RECEIPT_LISTENER_ENABLED: 'false'
      ATTACHMENT_CONVERSION_RECOVERY_ENABLED: 'false'
      TRIP_RESULT_WORKER_ENABLED: 'false'
      TRIP_STATUS_POLLING_ENABLED: 'false'
      STORY_RESULT_LISTENER_ENABLED: 'false'
      STORY_STATUS_POLLING_ENABLED: 'false'
  photo-converter:
    configMapData:
      ATTACHMENT_CONVERSION_CONSUMER_ENABLED: 'true'
      ATTACHMENT_CONVERSION_RECEIPT_LISTENER_ENABLED: 'true'
      ATTACHMENT_CONVERSION_RECOVERY_ENABLED: 'true'
      TRIP_RESULT_WORKER_ENABLED: 'false'
      TRIP_STATUS_POLLING_ENABLED: 'false'
      STORY_RESULT_LISTENER_ENABLED: 'false'
      STORY_STATUS_POLLING_ENABLED: 'false'
  trip-result-worker:
    configMapData:
      ATTACHMENT_CONVERSION_CONSUMER_ENABLED: 'false'
      ATTACHMENT_CONVERSION_RECEIPT_LISTENER_ENABLED: 'false'
      ATTACHMENT_CONVERSION_RECOVERY_ENABLED: 'false'
      TRIP_RESULT_WORKER_ENABLED: 'true'
      TRIP_STATUS_POLLING_ENABLED: 'true'
      STORY_RESULT_LISTENER_ENABLED: 'true'
      STORY_STATUS_POLLING_ENABLED: 'true'
    springProperties:
      app:
        trip:
          result-listener-enabled: true
        outbox:
          receipt-listener-enabled: true
