[INPUT]
    Name tail
    Tag be.work.*
    Path /var/log/containers/auth-api-*_auth_backend-*.log,/var/log/containers/trip-api-*_trip_backend-*.log,/var/log/containers/photo-api-*_photo_backend-*.log,/var/log/containers/photo-converter-*_photo_backend-*.log,/var/log/containers/trip-result-worker-*_trip_backend-*.log
    multiline.parser cri
    DB /buffers/backend.db
    DB.Sync Normal
    DB.Locking True
    Read_From_Head Off
    Refresh_Interval 5
    Rotate_Wait 30
    Buffer_Max_Size 256k
    Skip_Long_Lines On
    Mem_Buf_Limit 4M
    storage.type filesystem
[FILTER]
    Name parser
    Match be.*
    Key_Name log
    Parser app_json
    Reserve_Data On
    Preserve_Key Off
[FILTER]
    Name lua
    Match be.*
    script /fluent-bit/etc/sanitize.lua
    call sanitize
    enable_flb_null true
[OUTPUT]
    Name cloudwatch_logs
    Match be.*
    region ap-northeast-2
    log_group_name /yeodam/v3/production/backend
    log_stream_prefix be-
    auto_create_group false
    auto_retry_requests true
    workers 1
    Retry_Limit False
    storage.total_limit_size 64M
