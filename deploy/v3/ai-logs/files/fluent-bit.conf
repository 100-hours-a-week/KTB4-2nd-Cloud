[SERVICE]
    Flush 5
    Grace 30
    Log_Level warn
    Parsers_File /fluent-bit/etc/parsers.conf
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020
    Health_Check On
    storage.path /buffers/chunks
    storage.sync normal
    storage.checksum on
    storage.backlog.mem_limit 4M
    storage.metrics on
[INPUT]
    Name tail
    Tag ai.api.*
    Path /var/log/containers/ai-api-*_ai_ai-*.log
    multiline.parser cri
    DB /buffers/api.db
    DB.Sync Normal
    DB.Locking True
    Read_From_Head Off
    Refresh_Interval 5
    Rotate_Wait 30
    Buffer_Max_Size 256k
    Skip_Long_Lines On
    Mem_Buf_Limit 4M
    storage.type filesystem
[INPUT]
    Name tail
    Tag ai.runner.*
    Path /var/log/containers/ai-runner-*_ai_ai-*.log
    multiline.parser cri
    DB /buffers/runner.db
    DB.Sync Normal
    DB.Locking True
    Read_From_Head Off
    Refresh_Interval 5
    Rotate_Wait 30
    Buffer_Max_Size 256k
    Skip_Long_Lines On
    Mem_Buf_Limit 4M
    storage.type filesystem
[FILTER]
    Name parser
    Match ai.*
    Key_Name log
    Parser app_json
    Reserve_Data On
    Preserve_Key Off
[FILTER]
    Name lua
    Match ai.*
    script /fluent-bit/etc/sanitize.lua
    call sanitize
    enable_flb_null true
[OUTPUT]
    Name cloudwatch_logs
    Match ai.api.*
    region ap-northeast-2
    log_group_name /yeodam/v3/production/ai-api
    log_stream_prefix api-
    auto_create_group false
    auto_retry_requests true
    workers 1
    Retry_Limit False
    storage.total_limit_size 64M
[OUTPUT]
    Name cloudwatch_logs
    Match ai.runner.*
    region ap-northeast-2
    log_group_name /yeodam/v3/production/ai-runner
    log_stream_prefix runner-
    auto_create_group false
    auto_retry_requests true
    workers 1
    Retry_Limit False
    storage.total_limit_size 64M
