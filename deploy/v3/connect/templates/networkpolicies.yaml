{{- if .Values.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-v3-connect-to-brokers
  namespace: kafka
  labels:
    app.kubernetes.io/part-of: yeodam
    yeodam.io/stage: v3
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: yeodam-v3-kafka
      strimzi.io/kind: Kafka
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          strimzi.io/cluster: yeodam-v3-connect
          strimzi.io/kind: KafkaConnect
    ports:
    - protocol: TCP
      port: 9093
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-v3-connect-runtime
  namespace: kafka
  labels:
    app.kubernetes.io/part-of: yeodam
    yeodam.io/stage: v3
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: yeodam-v3-connect
      strimzi.io/kind: KafkaConnect
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          name: strimzi-cluster-operator
    - podSelector:
        matchLabels:
          app.kubernetes.io/instance: connect-smoke
    ports:
    - protocol: TCP
      port: 8083
  egress:
  - to:
    - podSelector:
        matchLabels:
          strimzi.io/cluster: yeodam-v3-kafka
          strimzi.io/kind: Kafka
    ports:
    - protocol: TCP
      port: 9093
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-connect-api
  namespace: kafka
  labels:
    app.kubernetes.io/part-of: yeodam
    yeodam.io/stage: v3
spec:
  podSelector:
    matchLabels:
      name: strimzi-cluster-operator
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          strimzi.io/cluster: yeodam-v3-connect
          strimzi.io/kind: KafkaConnect
    ports:
    - protocol: TCP
      port: 8083
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-connect-check-api
  namespace: kafka
  labels:
    app.kubernetes.io/part-of: yeodam
    yeodam.io/stage: v3
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: connect-smoke
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          strimzi.io/cluster: yeodam-v3-connect
          strimzi.io/kind: KafkaConnect
    ports:
    - protocol: TCP
      port: 8083
{{- end }}
