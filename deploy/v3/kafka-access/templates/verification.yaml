{{- if and .Values.enabled .Values.verification.enabled }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: v3-access-check
  namespace: kafka
  labels:
    strimzi.io/cluster: yeodam-v3-kafka
    app.kubernetes.io/part-of: yeodam
    app.kubernetes.io/instance: kafka-access-check
    yeodam.io/stage: v3
spec:
  partitions: 1
  replicas: 3
  config:
    min.insync.replicas: 2
    retention.ms: 3600000
    retention.bytes: 10485760
    segment.bytes: 1048576
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: v3-access-other
  namespace: kafka
  labels:
    strimzi.io/cluster: yeodam-v3-kafka
    app.kubernetes.io/part-of: yeodam
    app.kubernetes.io/instance: kafka-access-check
    yeodam.io/stage: v3
spec:
  partitions: 1
  replicas: 3
  config:
    min.insync.replicas: 2
    retention.ms: 3600000
    retention.bytes: 10485760
    segment.bytes: 1048576
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: v3-access-writer
  namespace: kafka
  labels:
    strimzi.io/cluster: yeodam-v3-kafka
    app.kubernetes.io/part-of: yeodam
    app.kubernetes.io/instance: kafka-access-check
    yeodam.io/stage: v3
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
    - resource:
        type: topic
        name: v3-access-check
        patternType: literal
      operations:
      - Write
      - Describe
      - DescribeConfigs
      host: '*'
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: v3-access-reader
  namespace: kafka
  labels:
    strimzi.io/cluster: yeodam-v3-kafka
    app.kubernetes.io/part-of: yeodam
    app.kubernetes.io/instance: kafka-access-check
    yeodam.io/stage: v3
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
    - resource:
        type: topic
        name: v3-access-check
        patternType: literal
      operations:
      - Read
      - Describe
      host: '*'
    - resource:
        type: group
        name: v3-access-check-reader
        patternType: literal
      operations:
      - Read
      - Delete
      host: '*'
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: v3-access-denied
  namespace: kafka
  labels:
    strimzi.io/cluster: yeodam-v3-kafka
    app.kubernetes.io/part-of: yeodam
    app.kubernetes.io/instance: kafka-access-check
    yeodam.io/stage: v3
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
    - resource:
        type: topic
        name: v3-access-check
        patternType: literal
      operations:
      - Describe
      host: '*'
    - resource:
        type: group
        name: v3-access-check-denied
        patternType: literal
      operations:
      - Read
      - Delete
      host: '*'

---
apiVersion: batch/v1
kind: Job
metadata:
  name: v3-access-check
  namespace: kafka
  labels: {app.kubernetes.io/part-of: yeodam, yeodam.io/stage: v3}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 480
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-access-check
        app.kubernetes.io/instance: kafka-smoke
        app.kubernetes.io/part-of: yeodam
        yeodam.io/stage: v3
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: {yeodam.io/role: system}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: check
          image: quay.io/strimzi/kafka@sha256:b9b9e37491ce17c1b2722b3668661de91430d9437acf18c5f5bafaef38138652
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 384Mi}
          env:
            - {name: KAFKA_HEAP_OPTS, value: '-Xms32m -Xmx128m'}
          command: [/bin/bash, -ec]
          args:
            - |
{{ .Files.Get "files/verify.sh" | indent 14 }}
          volumeMounts:
            - {name: temp, mountPath: /tmp}
            - {name: writer, mountPath: /credentials/writer, readOnly: true}
            - {name: reader, mountPath: /credentials/reader, readOnly: true}
            - {name: denied, mountPath: /credentials/denied, readOnly: true}
            - {name: ca, mountPath: /ca, readOnly: true}
      volumes:
        - {name: temp, emptyDir: {sizeLimit: 16Mi}}
        - name: writer
          secret: {secretName: v3-access-writer, items: [{key: password, path: password}]}
        - name: reader
          secret: {secretName: v3-access-reader, items: [{key: password, path: password}]}
        - name: denied
          secret: {secretName: v3-access-denied, items: [{key: password, path: password}]}
        - name: ca
          secret: {secretName: yeodam-v3-kafka-cluster-ca-cert, items: [{key: ca.crt, path: ca.crt}]}
{{- end }}
