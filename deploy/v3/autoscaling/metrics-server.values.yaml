image:
  repository: registry.k8s.io/metrics-server/metrics-server
  tag: v0.9.0@sha256:d9862115e7c7881280d3d75ca26bda8ffc0fc213315979575bf23ce9826205c0
replicas: 1
nodeSelector:
  yeodam.io/role: worker
  yeodam.io/stage: v3
  kubernetes.io/arch: amd64
  kubernetes.io/os: linux
tolerations:
- key: yeodam.io/role
  operator: Equal
  value: worker
  effect: NoSchedule
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 192Mi
args: []
apiService:
  insecureSkipTLSVerify: false
tls:
  type: helm
metrics:
  enabled: false
defaultArgs:
- --cert-dir=/tmp
- --kubelet-preferred-address-types=InternalIP
- --kubelet-use-node-status-port
- --metric-resolution=30s
priorityClassName: ''
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
