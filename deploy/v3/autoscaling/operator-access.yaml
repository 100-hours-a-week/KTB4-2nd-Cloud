# Apply only with the pinned KEDA release, separately from app policies.
apiVersion: v1
kind: Namespace
metadata:
  name: keda
  labels:
    app.kubernetes.io/part-of: yeodam
    yeodam.io/stage: v3
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: v3-keda-control, namespace: keda}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ipBlock: {cidr: 10.40.0.0/16}}]
      ports: [{protocol: TCP, port: 6443}, {protocol: TCP, port: 9443}]
    - from: [{podSelector: {}}]
      ports: [{protocol: TCP, port: 9666}, {protocol: TCP, port: 9443}, {protocol: TCP, port: 6443}]
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}, podSelector: {matchLabels: {app.kubernetes.io/name: v3-prometheus}}}]
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{ipBlock: {cidr: 10.40.0.0/16}}, {ipBlock: {cidr: 172.20.0.1/32}}]
      ports: [{protocol: TCP, port: 443}]
    - to: [{podSelector: {}}]
      ports: [{protocol: TCP, port: 9666}, {protocol: TCP, port: 9443}, {protocol: TCP, port: 6443}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kafka}}, podSelector: {matchLabels: {strimzi.io/cluster: yeodam-v3-kafka, strimzi.io/kind: Kafka}}}]
      ports: [{protocol: TCP, port: 9093}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: v3-keda-metrics-egress, namespace: observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: v3-prometheus}}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: keda}}}]
      ports: [{protocol: TCP, port: 8080}]
