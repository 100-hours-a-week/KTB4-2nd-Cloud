{{- if and .Values.connectorEnabled (not .Values.enabled) }}{{ fail "Prepare Outbox dependencies before enabling its Connector" }}{{ end }}
{{- if .Values.enabled }}
{{- $_ := required "Supply only the reviewed public MySQL CA truststore" .Values.mysqlTruststore }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: v3-outbox-mysql-ca
  namespace: kafka
  labels: {app.kubernetes.io/part-of: yeodam, yeodam.io/stage: v3}
binaryData:
  mysql-truststore.jks: {{ .Values.mysqlTruststore | quote }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ ternary "prod.yeodam.schema-history-operating" "prod.yeodam.schema-history" .Values.operating }}
  namespace: kafka
  labels: {strimzi.io/cluster: yeodam-v3-kafka, app.kubernetes.io/part-of: yeodam, yeodam.io/stage: v3}
  annotations: {helm.sh/resource-policy: keep}
spec:
  topicName: {{ ternary "prod.yeodam.schema-history-operating" "prod.yeodam.schema-history" .Values.operating }}
  partitions: 1
  replicas: 3
  config:
    min.insync.replicas: 2
    cleanup.policy: delete
    retention.ms: -1
    retention.bytes: -1
    segment.bytes: 1048576
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ ternary "v3-operating-outbox-heartbeat" "v3-outbox-heartbeat" .Values.operating }}
  namespace: kafka
  labels: {strimzi.io/cluster: yeodam-v3-kafka, app.kubernetes.io/part-of: yeodam, yeodam.io/stage: v3}
  annotations: {helm.sh/resource-policy: keep}
spec:
  topicName: {{ ternary "__debezium-heartbeat.v3.yeodam.operating.outbox" "__debezium-heartbeat.v3.yeodam.outbox" .Values.operating }}
  partitions: 1
  replicas: 3
  config:
    min.insync.replicas: 2
    cleanup.policy: compact,delete
    retention.ms: 86400000
    retention.bytes: 1048576
    segment.bytes: 1048576
    segment.ms: 3600000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-outbox-to-mysql
  namespace: kafka
  labels: {app.kubernetes.io/part-of: yeodam, yeodam.io/stage: v3}
spec:
  podSelector: {matchLabels: {strimzi.io/cluster: yeodam-v3-connect, strimzi.io/kind: KafkaConnect}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: mysql}}
          podSelector: {matchLabels: {app.kubernetes.io/name: mysql, app.kubernetes.io/instance: yeodam-v3-mysql}}
      ports: [{protocol: TCP, port: 3306}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mysql-from-outbox
  namespace: mysql
  labels: {app.kubernetes.io/part-of: yeodam, yeodam.io/stage: v3}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: mysql, app.kubernetes.io/instance: yeodam-v3-mysql}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kafka}}
          podSelector: {matchLabels: {strimzi.io/cluster: yeodam-v3-connect, strimzi.io/kind: KafkaConnect}}
      ports: [{protocol: TCP, port: 3306}]
{{- if .Values.connectorEnabled }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: yeodam-v3-outbox
  namespace: kafka
  labels: {strimzi.io/cluster: yeodam-v3-connect, app.kubernetes.io/part-of: yeodam, yeodam.io/stage: v3}
spec:
  class: io.debezium.connector.mysql.MySqlConnector
  tasksMax: 1
  state: {{ .Values.connectorState }}
  autoRestart: {enabled: true, maxRestarts: 3}
  config:
    {{- $config := omit (.Files.Get "files/connector.json" | fromJson) "connector.class" "tasks.max" }}
    {{- if .Values.operating }}
    {{- $_ := set $config "topic.prefix" "v3.yeodam.operating.outbox" }}
    {{- $_ := set $config "schema.history.internal.kafka.topic" "prod.yeodam.schema-history-operating" }}
    {{- $_ := set $config "predicates.heartbeat.pattern" "^__debezium-heartbeat\\.v3\\.yeodam\\.operating\\.outbox$" }}
    {{- end }}
    {{- $config | toYaml | nindent 4 }}
{{- end }}
{{- end }}
