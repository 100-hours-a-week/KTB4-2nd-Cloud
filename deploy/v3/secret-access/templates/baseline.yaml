apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: yeodam
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    yeodam.io/stage: v3
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-controller-egress
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: yeodam
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Kubernetes API and regional AWS STS/Secrets Manager through existing NAT.
    # This is a port boundary, not an AWS-only/FQDN allowlist.
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-core-pod-identity
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
      app.kubernetes.io/instance: external-secrets
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 169.254.170.23/32}
      ports:
        - {protocol: TCP, port: 80}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane-webhook
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
      app.kubernetes.io/instance: external-secrets
  policyTypes: [Ingress]
  ingress:
    - from:
        # Foundation VPC; verify the control-plane source and cluster SG live.
        - ipBlock: {cidr: 10.40.0.0/16}
      ports:
        - {protocol: TCP, port: 10250}
