{{- if .Values.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  annotations: {helm.sh/resource-policy: keep}
  labels:
    app.kubernetes.io/part-of: yeodam
    yeodam.io/stage: v3
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: argocd}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: control-egress, namespace: argocd}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: argocd}}}]
      ports: [{protocol: TCP, port: 6379}, {protocol: TCP, port: 8081}, {protocol: TCP, port: 8080}]
    # GitHub/registry HTTPS and the Kubernetes API; scoped SA/RBAC is the API write boundary.
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{protocol: TCP, port: 443}]
{{- $delivery := .Files.Get "files/delivery.json" | fromJson }}
{{- range $ns := $delivery.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: argocd-apps, namespace: {{ $ns }}}
rules:
{{ index $delivery.roles $ns | toYaml | indent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: argocd-apps, namespace: {{ $ns }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: argocd-apps}
subjects: [{kind: ServiceAccount, name: argocd-application-controller, namespace: argocd}]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: delivery-status, namespace: argocd}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [yeodam-v3-apps]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: delivery-status, namespace: argocd}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: delivery-status}
subjects: [{kind: Group, name: yeodam-v3-delivery-observer, apiGroup: rbac.authorization.k8s.io}]
{{- if .Values.appsAdoptionReviewed }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: yeodam-v3-apps, namespace: argocd}
spec:
  description: Approved app bundle only; no Secret, PVC, data workload or cluster ownership
  sourceRepos: [https://github.com/100-hours-a-week/KTB4-2nd-Cloud.git]
  destinations:
  {{- range $ns := $delivery.namespaces }}
    - {server: https://kubernetes.default.svc, namespace: {{ $ns }}}
  {{- end }}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
{{ $delivery.projectKinds | toYaml | indent 4 }}
  orphanedResources: {warn: true}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: yeodam-v3-apps, namespace: argocd}
spec:
  project: yeodam-v3-apps
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-2nd-Cloud.git
    targetRevision: deploy/v3-approved
    path: manifests
    directory: {recurse: false, include: release.yaml}
  destination: {server: https://kubernetes.default.svc, namespace: frontend}
  revisionHistoryLimit: 3
  syncPolicy:
    automated:
      enabled: {{ .Values.automatedSync }}
      prune: false
      selfHeal: false
      allowEmpty: false
    syncOptions: [FailOnSharedResource=true]
{{- else if .Values.automatedSync }}
{{- fail "All app Helm ownership must be reviewed before automated sync" }}
{{- end }}
{{- else if or .Values.appsAdoptionReviewed .Values.automatedSync }}
{{- fail "Argo CD access must be explicitly enabled first" }}
{{- end }}
