bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-cert-file /credentials/tls.crt
tls-key-file /credentials/tls.key
tls-ca-cert-file /credentials/ca.crt
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
daemonize no
logfile ""
loglevel notice
dir /data/files
aclfile /tmp/users.acl
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 16mb
aof-use-rdb-preamble yes
save ""
stop-writes-on-bgsave-error yes
maxmemory 64mb
maxmemory-policy noeviction
maxclients 128
maxmemory-clients 32mb
client-output-buffer-limit pubsub 8mb 2mb 60
client-output-buffer-limit normal 4mb 0 0
