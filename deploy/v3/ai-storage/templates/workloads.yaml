{{- if .Values.enabled }}
{{- $contract := .Files.Get "files/contract.json" | fromJson }}
{{- range $name, $c := $contract }}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ $name }}, namespace: {{ $name }}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ $name }}-runtime, namespace: {{ $name }}}
data:
{{- if eq $name "ai-redis" }}
{{ ($.Files.Glob "files/redis/*").AsConfig | indent 2 }}
{{- else }}
{{ ($.Files.Glob "files/qdrant/*").AsConfig | indent 2 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ $name }}-members, namespace: {{ $name }}}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/instance: {{ $name }}, yeodam.io/stage: v3}
  ports: [{name: tls, port: {{ $c.port }}, targetPort: tls}]
---
apiVersion: v1
kind: Service
metadata: {name: {{ $name }}, namespace: {{ $name }}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ $name }}, yeodam.io/stage: v3}
  ports: [{name: tls, port: {{ $c.port }}, targetPort: tls}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: {{ $name }}, namespace: {{ $name }}}
spec:
  replicas: 1
  serviceName: {{ $name }}-members
  updateStrategy: {type: OnDelete}
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $name }}, yeodam.io/stage: v3}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $name }}
        app.kubernetes.io/component: storage
        app.kubernetes.io/part-of: yeodam
        yeodam.io/stage: v3
        yeodam.io/ai-storage: "true"
      annotations:
        checksum/runtime: {{ (printf "%s%s" (($.Files.Glob "files/redis/*").AsConfig) (($.Files.Glob "files/qdrant/*").AsConfig)) | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      nodeSelector: {yeodam.io/role: data, yeodam.io/stage: v3}
      tolerations:
        - {key: yeodam.io/role, operator: Equal, value: data, effect: NoSchedule}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                namespaces: [ai-redis, qdrant]
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {yeodam.io/ai-storage: "true"}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $c.uid }}
        runAsGroup: {{ $c.uid }}
        fsGroup: {{ $c.uid }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 120
      containers:
        - name: {{ $name }}
          image: {{ index $.Values.images $c.imageKey }}
          imagePullPolicy: IfNotPresent
          workingDir: /data
          {{- if eq $name "ai-redis" }}
          command: [/bin/sh, /runtime/start.sh]
          {{- else }}
          command: [/qdrant/qdrant, --config-path, /runtime/qdrant.yaml]
          env:
            - name: QDRANT__SERVICE__API_KEY
              valueFrom: {secretKeyRef: {name: qdrant-bootstrap, key: api-key}}
          {{- end }}
          ports: [{name: tls, containerPort: {{ $c.port }}}]
          resources:
{{ $c.resources | toYaml | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          {{- range $probe := list "startupProbe" "readinessProbe" "livenessProbe" }}
          {{ $probe }}:
            {{- if eq $name "ai-redis" }}
            exec: {command: [/bin/sh, /runtime/health.sh]}
            {{- else }}
            httpGet:
              path: {{ if eq $probe "livenessProbe" }}/livez{{ else }}/readyz{{ end }}
              port: tls
              scheme: HTTPS
            {{- end }}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: {{ if eq $probe "startupProbe" }}60{{ else if eq $probe "livenessProbe" }}6{{ else }}3{{ end }}
          {{- end }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: runtime, mountPath: /runtime, readOnly: true}
            - {name: credentials, mountPath: /credentials, readOnly: true}
      volumes:
        - {name: runtime, configMap: {name: {{ $name }}-runtime, defaultMode: 0444}}
        - {name: credentials, secret: {secretName: {{ $c.secret }}, defaultMode: 0440}}
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations: {helm.sh/resource-policy: keep}
      spec:
        accessModes: [ReadWriteOncePod]
        storageClassName: yeodam-v3-gp3-retain
        resources:
          requests: {storage: {{ $c.storage }}}
{{- end }}
{{- end }}
