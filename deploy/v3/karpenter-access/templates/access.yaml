apiVersion: v1
kind: Namespace
metadata:
  name: karpenter
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/part-of: yeodam
    yeodam.io/stage: v3
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: karpenter
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-egress
  namespace: karpenter
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: karpenter, app.kubernetes.io/instance: karpenter}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    # Kubernetes API and AWS HTTPS APIs. NetworkPolicy cannot select AWS FQDNs;
    # IAM provides the service/resource boundary. Existing NATs are reused.
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{protocol: TCP, port: 443}]
    - to: [{ipBlock: {cidr: 169.254.170.23/32}}]
      ports: [{protocol: TCP, port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-health
  namespace: karpenter
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: karpenter, app.kubernetes.io/instance: karpenter}
  policyTypes: [Ingress]
  ingress:
    - from: [{ipBlock: {cidr: 10.40.0.0/16}}]
      ports: [{protocol: TCP, port: 8081}]
