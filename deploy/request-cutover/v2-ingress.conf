# Local container integration fixture. AWS rehearsal replaces this origin with its ALB.
events {}
http {
    access_log off;
    server {
        listen 8080;
        listen 443 ssl;
        ssl_certificate /tls/server.crt;
        ssl_certificate_key /tls/server.key;
        client_max_body_size 150m;
        location /api/ {
            proxy_pass http://v2-backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }
        location / {
            # DNS resolves at request time so API-only tests do not need the FE profile.
            resolver 127.0.0.11 valid=5s;
            set $frontend http://v2-frontend:3000;
            proxy_pass $frontend;
            proxy_set_header Host $host;
        }
    }
}
