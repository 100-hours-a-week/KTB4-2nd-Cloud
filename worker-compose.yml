name: yeodam-ai-worker

services:
  ai-worker:
    image: "${AI_IMAGE:-yeodam-ai-worker:local}${AI_DIGEST:+@${AI_DIGEST}}"
    platform: linux/amd64
    restart: on-failure:3
    init: true
    stop_grace_period: 7m
    ports:
      - "8000:8000"
    environment:
      API_KEY: "${API_KEY:?API_KEY is required}"
      S3_BUCKET: "${S3_BUCKET:?S3_BUCKET is required}"
      FAKE_PIPELINE: "${FAKE_PIPELINE:-0}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - qdrant-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  qdrant-data: