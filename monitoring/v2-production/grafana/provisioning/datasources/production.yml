apiVersion: 1

datasources:
  - name: Prometheus
    uid: production-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: production-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  - name: Production CloudWatch
    uid: production-cloudwatch
    type: cloudwatch
    access: proxy
    jsonData:
      authType: default
      defaultRegion: ap-northeast-2
    editable: false
