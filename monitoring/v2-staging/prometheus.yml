global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: plg-prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: plg-loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
  - job_name: plg-grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
  # Shared Redis snapshot: one logical target, never one series per ECS task.
  - job_name: v2-ai-shared
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/ai-metrics/api-key
    static_configs:
      - targets: ["ai-api.staging.yeodam.internal:80"]
        labels:
          env: staging
          service: ai-api
          scope: shared-redis
