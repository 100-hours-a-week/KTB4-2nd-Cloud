name: V3 Connect image publication
on:
  push:
    branches: [main]
    paths:
      - 'deploy/v3/connect-image/**'
      - 'deploy/v3/outbox/**'
      - 'scripts/validate-v3-outbox.sh'
      - 'scripts/v3_outbox_contract.py'
      - 'scripts/prepare-v3-outbox-ca.py'
      - 'tests/ci/smoke-v3-outbox.py'
      - 'tests/ci/v3/OutboxWire.java'
      - 'scripts/prepare-v3-connect-image.py'
      - 'scripts/validate-v3-connect-image.sh'
      - 'tests/ci/smoke-v3-connect.py'
      - 'tests/ci/v3/CheckConnectPlugins.java'
      - '.github/workflows/v3-connect-image.yml'
permissions:
  contents: read
concurrency:
  group: v3-connect-image-main
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == '100-hours-a-week/KTB4-2nd-Cloud'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      V3_CONNECT_IMAGE: ghcr.io/100-hours-a-week/yeodam-v3-connect:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Build and test the exact image before publication
        run: |
          export V3_OUTBOX_IMAGE="$V3_CONNECT_IMAGE"
          export V3_OUTBOX_RESULTS="$RUNNER_TEMP/yeodam-v3-connect-results"
          bash scripts/validate-v3-outbox.sh
      - name: Publish private image and record immutable input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          package=/orgs/100-hours-a-week/packages/container/yeodam-v3-connect
          if gh api "$package" > "$RUNNER_TEMP/connect-package.json" 2> "$RUNNER_TEMP/connect-package-error.txt"; then
            python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/connect-package.json"))["visibility"]=="private"'
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/connect-package-error.txt" || exit 1
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$V3_CONNECT_IMAGE"
          gh api "$package" > "$RUNNER_TEMP/connect-package.json"
          python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/connect-package.json"))["visibility"]=="private"'
          docker image inspect "$V3_CONNECT_IMAGE" --format '{{index .RepoDigests 0}}' > "$RUNNER_TEMP/connect-image-ref.txt"
          cat "$RUNNER_TEMP/connect-image-ref.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve image input and synthetic results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-connect-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/connect-image-ref.txt
            ${{ runner.temp }}/yeodam-v3-connect-results
          retention-days: 7
          if-no-files-found: warn
