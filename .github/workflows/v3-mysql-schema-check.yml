name: V3 MySQL schema checks
on:
  workflow_call:
  push:
    branches-ignore: [main]
    paths:
      - 'scripts/v2_v3_photo_migration.py'
      - 'scripts/migrate-v2-photos.py'
      - 'scripts/migration/photo-references.sql'
      - 'scripts/migration/photo-sdk-requirements.txt'
      - 'tests/ci/test_v2_v3_photos.py'
      - 'scripts/export-v2-mysql-backup.py'
      - 'scripts/restore-v2-mysql-backup.py'
      - 'scripts/run-v2-mysql-backup.py'
      - 'tests/ci/test_v2_mysql_backup.py'
      - 'scripts/v2_v3_mysql_logical.py'
      - 'tests/ci/test_v2_v3_mysql_logical.py'
      - 'tests/ci/smoke-v2-v3-mysql-logical.py'
      - 'scripts/check-v3-mysql-schema.py'
      - 'tests/ci/test_v3_mysql_schema.py'
      - 'tests/ci/v3/mysql-schema.values.fixture.yaml'
      - 'deploy/v3/environments/foundation/mysql-schema.values.yaml'
      - 'deploy/v3/environments/foundation/mysql-cdc-secrets.values.yaml'
      - 'deploy/v3/mysql-schema-image/**'
      - 'deploy/v3/mysql-schema/**'
      - 'deploy/v3/mysql/**'
      - 'scripts/prepare-v3-mysql-schema-image.py'
      - 'scripts/manage-v3-mysql-cdc.py'
      - 'scripts/create-v3-mysql-bootstrap-secret.py'
      - 'scripts/validate-v3-mysql-schema-image.sh'
      - 'tests/ci/smoke-v3-mysql-schema.py'
      - '.github/workflows/v3-mysql-schema-check.yml'
      - '.github/workflows/v3-mysql-schema-image.yml'
permissions:
  contents: read
jobs:
  validate:
    name: Minimum-budget schema and CDC runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Build pinned schema image and exercise isolated TLS replication
        run: bash scripts/validate-v3-mysql-schema-image.sh
      - name: Preserve synthetic results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-mysql-schema-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yeodam-v3-mysql-schema-results
          retention-days: 3
          if-no-files-found: warn
