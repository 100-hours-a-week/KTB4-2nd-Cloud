name: V3 platform checks

on:
  workflow_call:
  push:
    paths:
      - 'deploy/v3/**'
      - 'scripts/check-v3-ai-storage.py'
      - 'scripts/check-v3-ai-storage-plan.py'
      - 'scripts/prepare-v3-ai-storage-secrets.py'
      - 'scripts/verify-v3-ai-storage.py'
      - 'tests/ci/test_v3_ai_storage.py'
      - 'terraform/v3/ingress/**'
      - 'scripts/check-v3-external.py'
      - 'scripts/check-v3-ingress-plan.py'
      - 'scripts/prepare-v3-external-values.py'
      - 'scripts/v3_frontend_contract.py'
      - 'tests/ci/test_v3_external.py'
      - 'scripts/v3_websocket_contract.py'
      - 'scripts/check-v3-websocket.py'
      - 'scripts/prepare-v3-websocket-values.py'
      - 'tests/ci/test_v3_websocket.py'
      - 'terraform/v3/backend/**'
      - 'scripts/check-v3-backend-access.py'
      - 'scripts/check-v3-backend-plan.py'
      - 'scripts/prepare-v3-backend-supply.py'
      - 'scripts/prepare-v3-backend-values.py'
      - 'scripts/prepare-v3-backend-rollout.py'
      - 'scripts/check-v3-backend-prerequisites.py'
      - 'tests/ci/test_v3_backend_rollout.py'
      - 'scripts/prepare_v3_backend_values_contract.py'
      - 'tests/ci/test_v3_backend_connections.py'
      - 'scripts/v3_outbox_contract.py'
      - 'scripts/check-v3-outbox.py'
      - 'scripts/prepare-v3-outbox-ca.py'
      - 'tests/ci/test_v3_outbox.py'
      - 'terraform/v2/production/websocket.tf'
      - 'terraform/v2/production/backend-service.tf'
      - 'scripts/configure-production-websocket.py'
      - 'tests/ci/test_production_websocket.py'
      - 'deploy/v2-production/websocket/**'
      - 'deploy/production/release-policy.json'
      - 'scripts/prepare-production-release.py'
      - 'tests/ci/test_production_release_prepare.py'
      - '.github/workflows/production-release-prepare.yml'
      - 'scripts/check-v3-mongodb.py'
      - 'scripts/create-v3-mongodb-bootstrap-secret.py'
      - 'tests/ci/test_v3_mongodb.py'
      - 'scripts/check-v3-redis.py'
      - 'scripts/create-v3-redis-bootstrap-secret.py'
      - 'tests/ci/test_v3_redis.py'
      - 'tests/ci/test_v3_validation_download.py'
      - 'scripts/check-v3-mysql-schema.py'
      - 'scripts/manage-v3-mysql-cdc.py'
      - 'scripts/prepare-v3-mysql-schema-image.py'
      - 'tests/ci/test_v3_mysql_schema.py'
      - 'scripts/check-v3-mysql.py'
      - 'scripts/create-v3-mysql-bootstrap-secret.py'
      - 'tests/ci/test_v3_mysql.py'
      - 'scripts/check-v3-kafka.py'
      - 'scripts/check-v3-connect.py'
      - 'scripts/prepare-v3-connect-image.py'
      - 'tests/ci/test_v3_connect.py'
      - 'scripts/check-v3-kafka-access.py'
      - 'tests/ci/test_v3_kafka_access.py'
      - 'tests/ci/test_v3_kafka.py'
      - 'scripts/check-v3-data-plan.py'
      - 'tests/ci/test_v3_data_plan.py'
      - 'scripts/check-v3-kafka-plan.py'
      - 'tests/ci/test_v3_kafka_plan.py'
      - 'scripts/check-v3-storage.py'
      - 'tests/ci/test_v3_storage.py'
      - 'scripts/check-v3-platform.py'
      - 'scripts/check-v3-apps.py'
      - 'scripts/check-v3-nodepools.py'
      - 'tests/ci/test_v3_nodepools.py'
      - 'scripts/v3_backend_contract.py'
      - 'scripts/check-v3-secrets.py'
      - 'terraform/v3/karpenter/**'
      - 'scripts/check-v3-karpenter-plan.py'
      - 'tests/ci/test_v3_karpenter_plan.py'
      - 'scripts/check-v3-karpenter.py'
      - 'scripts/filter-v3-karpenter.py'
      - 'scripts/helm-plugins/**'
      - 'tests/ci/test_v3_karpenter.py'
      - 'terraform/v3/secrets/**'
      - 'terraform/v3/foundation/**'
      - 'scripts/prepare-v3-validation.py'
      - 'scripts/requirements-v3-validation.txt'
      - 'scripts/validate-v3-platform.sh'
      - 'tests/ci/v3/**'
      - 'tests/ci/test_v3_platform.py'
      - 'tests/ci/test_v3_apps.py'
      - 'tests/ci/test_v3_backend.py'
      - 'tests/ci/test_v3_secrets.py'
      - '.github/workflows/v3-platform-check.yml'
      - '.github/workflows/cloud-pr-gate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Helm and platform contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render, validate and test V3 platform, apps and Secret supply
        env:
          V3_RENDERED_DIR: ${{ runner.temp }}/v3-rendered
        run: bash scripts/validate-v3-platform.sh

      - name: Verify disabled production release contract without credentials
        run: python3 -m unittest discover -s tests/ci -p 'test_production_release_prepare.py'

      - name: Verify production WebSocket configuration and rollback boundaries
        run: python3 -m unittest discover -s tests/ci -p 'test_production_websocket.py'

      - name: Set up Terraform for offline infrastructure tests
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Verify minimum-cost data Plan protection
        run: python3 -m unittest discover -s tests/ci -p 'test_v3_data_plan.py'

      - name: Verify minimum-cost Kafka Plan protection
        run: python3 -m unittest discover -s tests/ci -p 'test_v3_kafka_plan.py'

      - name: Verify controller-only Karpenter Plan protection
        run: python3 -m unittest discover -s tests/ci -p 'test_v3_karpenter_plan.py'

      - name: Validate Karpenter IAM and interruption events using mock AWS only
        working-directory: terraform/v3/karpenter
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color

      - name: Validate Secret IAM using mock AWS provider only
        working-directory: terraform/v3/secrets
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color

      - name: Validate foundation networking using mock AWS provider only
        working-directory: terraform/v3/foundation
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color

      - name: Validate production WebSocket Terraform without AWS credentials
        working-directory: terraform/v2/production
        run: |
          terraform fmt -check websocket.tf backend-service.tf
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color

      - name: Preserve rendered definitions without application Secret payloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3-rendered-${{ github.sha }}
          path: ${{ runner.temp }}/v3-rendered
          retention-days: 7
          if-no-files-found: warn

      - name: Validate independent BE IAM and private storage without AWS
        run: |
          terraform -chdir=terraform/v3/backend init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/v3/backend fmt -check
          terraform -chdir=terraform/v3/backend validate
          terraform -chdir=terraform/v3/backend test -no-color

      - name: Validate isolated ingress IAM, SG and validation certificate without AWS
        run: |
          terraform -chdir=terraform/v3/ingress fmt -check -recursive
          terraform -chdir=terraform/v3/ingress init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/v3/ingress validate
          terraform -chdir=terraform/v3/ingress test -no-color
