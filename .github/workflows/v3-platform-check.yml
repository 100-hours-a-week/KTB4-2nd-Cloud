      - 'scripts/filter-v3-karpenter.py'
      - 'scripts/helm-plugins/**'
      - 'tests/ci/test_v3_karpenter.py'
      - 'terraform/v3/secrets/**'
      - 'terraform/v3/foundation/**'
      - 'scripts/prepare-v3-validation.py'
      - 'scripts/requirements-v3-validation.txt'
