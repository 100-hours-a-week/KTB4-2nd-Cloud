permissions:
  contents: read

jobs:
  apm-runtime:
    name: APM pipeline and real image compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '25'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify synthetic tracing with candidate image libraries and bounded observers
        run: python3 tests/ci/smoke-v3-apm.py
      - name: Verify AI reader compatibility and real Langfuse SDK without network
        run: python3 tests/ci/run-v3-ai-observability.py

      - name: Verify production collector budgets and complete late spans
        env:
          V3_APM_RESULTS: ${{ runner.temp }}/apm-capacity
        run: python3 tests/ci/smoke-v3-apm-capacity.py
      - name: Verify production workflow boundaries and collector unavailability
        env:
          V3_APM_RESULTS: ${{ runner.temp }}/apm-workflow
        run: python3 tests/ci/smoke-v3-apm-workflow.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: apm-synthetic-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/apm-capacity
            ${{ runner.temp }}/apm-workflow
          retention-days: 7

  converter-scaling:
    name: Converter two-partition ownership and shutdown
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify real converter classes with synthetic local work only
        run: python3 tests/ci/smoke-v3-converter-scaling.py --output "$RUNNER_TEMP/converter-proof.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: converter-proof-${{ github.sha }}
          path: ${{ runner.temp }}/converter-proof.json
          retention-days: 7

  mongodb-health:
    name: MongoDB TLS health runtime
    # The pinned production binary rejects kernel >=6.19 (MongoDB SERVER-121912).
    # Keep the actual image/TLS test; do not bypass its allocator safety check.
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify MongoDB authenticated cached health at minimum resources
        run: |
          uname -r
          python3 tests/ci/smoke-v3-mongodb-health.py

  validate:
    name: Helm and platform contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render, validate and test V3 platform, apps and Secret supply
        env:
          V3_RENDERED_DIR: ${{ runner.temp }}/v3-rendered
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/validate-v3-platform.sh

      - name: Verify read-only Outbox aggregates with isolated MySQL
        run: python3 tests/ci/smoke-v3-outbox-observer.py

      - name: Check offline V2 to V3 migration evidence without credentials
        run: python3 -m unittest discover -s tests/ci -p 'test_v2_v3_migration.py'

      - name: Verify synthetic Qdrant snapshot and isolated restore without AWS
        run: bash scripts/validate-v2-qdrant-backup.sh

      - name: Preserve synthetic Qdrant results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qdrant-synthetic-${{ github.sha }}
          path: ${{ runner.temp }}/yeodam-v2-qdrant-results
          retention-days: 3
          if-no-files-found: ignore

      - name: Verify Redis transaction replay with isolated fixture data
        run: |
          image=$(sed -n 's/^image: //p' deploy/v3/redis/values.yaml)
          selected=$(python3 scripts/ci-pull-redis-image.py --image "$image")
          python3 scripts/verify-v3-redis-aof.py --image "$selected"
          ai_image=$(sed -n 's/^  redis: //p' deploy/v3/ai-storage/values.yaml)
          ai_selected=$(python3 scripts/ci-pull-redis-image.py --image "$ai_image")
          python3 scripts/verify-v3-redis-aof.py --store ai --image "$ai_selected"

      - name: Verify disabled production release contract without credentials
        run: python3 -m unittest discover -s tests/ci -p 'test_production_release_prepare.py'

      - name: Verify production WebSocket configuration and rollback boundaries
        run: python3 -m unittest discover -s tests/ci -p 'test_production_websocket.py'

      - name: Set up Terraform for offline infrastructure tests
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Validate V3 RunPod permissions with mock AWS only
        run: |
          terraform -chdir=terraform/v3/runpod fmt -check -recursive
          terraform -chdir=terraform/v3/runpod init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/v3/runpod validate -no-color
          terraform -chdir=terraform/v3/runpod test -no-color

      - name: Verify AI collector JSON preservation and masking without AWS
        run: |
          image=$(python3 -c 'import json; print(json.load(open("deploy/v3/ai-logs/image.lock.json"))["image"])')
          docker pull "$image"
          "$RUNNER_TEMP/yeodam-v3-validation/venv/bin/python" tests/ci/smoke-v3-ai-logs.py

      - name: Verify experiment query semantics with synthetic counters
        run: '"$RUNNER_TEMP/yeodam-v3-validation/venv/bin/python" tests/ci/smoke-v3-experiment.py'

      - name: Verify bounded CDC evidence SQL with isolated synthetic MySQL
        run: python3 tests/ci/smoke-v3-cdc-evidence.py

      - name: Verify minimal metrics and dashboards without AWS
        env:
          V3_HELM: ${{ runner.temp }}/yeodam-v3-validation/helm
        run: |
          "$RUNNER_TEMP/yeodam-v3-validation/venv/bin/python" tests/ci/smoke-v3-metrics.py

      - name: Validate AI log authority with mock AWS only
        run: |
          terraform -chdir=terraform/v3/ai-logs fmt -check -recursive
          terraform -chdir=terraform/v3/ai-logs init -backend=false -input=false -lockfile=readonly -plugin-dir="$GITHUB_WORKSPACE/terraform/v3/runpod/.terraform/providers"
          terraform -chdir=terraform/v3/ai-logs validate -no-color
          terraform -chdir=terraform/v3/ai-logs test -no-color

      - name: Verify deletion-only V2 retirement and retained resources without AWS
        run: |
          python3 -m unittest discover -s tests/ci -p 'test_v2_retirement.py'
          terraform fmt -check terraform/retirement-guard.tf terraform/v2/production/retirement-guard.tf
          for target in production base; do
            terraform -chdir="terraform/v2/retirement/$target" fmt -check -recursive
            terraform -chdir="terraform/v2/retirement/$target" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="terraform/v2/retirement/$target" validate -no-color
            terraform -chdir="terraform/v2/retirement/$target" test -no-color
          done

      - name: Verify final cutover ordering and disabled operating DNS with mock AWS only
        run: |
          python3 -m unittest discover -s tests/ci -p 'test_v2_v3_cutover.py'
          bash -n scripts/cutover/redis.sh scripts/cutover/kafka-audit.sh
          terraform -chdir=terraform/v3/cutover fmt -check -recursive
          terraform -chdir=terraform/v3/cutover init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/v3/cutover validate -no-color
          terraform -chdir=terraform/v3/cutover test -no-color

      - name: Verify minimum-cost data Plan protection
        run: python3 -m unittest discover -s tests/ci -p 'test_v3_data_plan.py'

      - name: Verify minimum-cost Kafka Plan protection
        run: python3 -m unittest discover -s tests/ci -p 'test_v3_kafka_plan.py'

      - name: Verify controller-only Karpenter Plan protection
        run: python3 -m unittest discover -s tests/ci -p 'test_v3_karpenter_plan.py'

      - name: Validate Karpenter IAM and interruption events using mock AWS only
        working-directory: terraform/v3/karpenter
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color

      - name: Validate Secret IAM using mock AWS provider only
        working-directory: terraform/v3/secrets
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color

      - name: Validate foundation networking using mock AWS provider only
        working-directory: terraform/v3/foundation
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color

      - name: Validate production WebSocket Terraform without AWS credentials
        working-directory: terraform/v2/production
        run: |
          terraform fmt -check websocket.tf backend-service.tf
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color

      - name: Preserve rendered definitions without application Secret payloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3-rendered-${{ github.sha }}
          path: ${{ runner.temp }}/v3-rendered
          retention-days: 7
          if-no-files-found: warn

      - name: Validate independent BE IAM and private storage without AWS
        run: |
          terraform -chdir=terraform/v3/backend init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/v3/backend fmt -check
          terraform -chdir=terraform/v3/backend validate
          terraform -chdir=terraform/v3/backend test -no-color

      - name: Validate isolated ingress IAM, SG and validation certificate without AWS
        run: |
          terraform -chdir=terraform/v3/ingress fmt -check -recursive
          terraform -chdir=terraform/v3/ingress init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/v3/ingress validate
          terraform -chdir=terraform/v3/ingress test -no-color

      - name: Validate read-only AI Pod Identities using mock AWS
        run: |
          terraform -chdir=terraform/v3/ai fmt -check -recursive
          terraform -chdir=terraform/v3/ai init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/v3/ai validate
          terraform -chdir=terraform/v3/ai test -no-color

      - name: Validate additive shared embedding path with mock AWS only
        working-directory: terraform/v3/shared-embedding
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test

      - name: Validate read-only delivery observer using mock AWS only
        working-directory: terraform/v3/delivery
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
          terraform test -no-color
