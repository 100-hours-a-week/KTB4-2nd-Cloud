name: V2 Staging Manifest Deployment

on:
  push:
    branches: [main]
    paths: ['deploy/v2/image-manifest.json']
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "다시 배포할 병합 완료 PR 번호 (검증된 조합이어야 함)"
        type: string
        required: true
      reason:
        description: "재실행 사유"
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write

concurrency:
  group: yeodam-v2-staging-release
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    steps:
      - name: Checkout Cloud main deployment code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Configure staging release credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_STAGING_RELEASE_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-duration-seconds: 7200
          role-session-name: yeodam-v2-staging-release

      - name: Verify and promote the merged manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.pull_request_number }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPORT_DIR: ${{ runner.temp }}/v2-staging-release
        run: |
          if [[ "$RELEASE_EVENT" == "push" ]]; then
            python3 scripts/deploy-v2-staging-release.py --commit "$RELEASE_COMMIT" --apply
          else
            python3 scripts/deploy-v2-staging-release.py --pr "$RELEASE_PR" --apply
          fi

      - name: Preserve release and recovery identifiers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-staging-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v2-staging-release/*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Write release summary
        if: always()
        env:
          RELEASE_REASON: ${{ inputs.reason || github.sha }}
        run: |
          {
            echo '## V2 staging release'
            echo "- Reason: $RELEASE_REASON"
            if [[ -f "$RUNNER_TEMP/v2-staging-release/release.json" ]]; then
              echo '```json'
              cat "$RUNNER_TEMP/v2-staging-release/release.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
