name: Legacy candidate controls

on:
  push:
    paths:
      - '.github/workflows/release-manifest-update.yml'
      - '.github/workflows/v2-release-manifest-update.yml'
      - '.github/workflows/legacy-manifest-check.yml'
      - 'scripts/prepare-legacy-manifest-input.py'
      - 'scripts/update-image-version.sh'
      - 'scripts/update-v2-release-manifest.py'
      - 'tests/ci/test_legacy_manifest_manual.py'
      - 'tests/ci/test_v2_release_event.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify manual-only legacy candidates and preserved validation
        run: |
          python3 -m unittest discover -s tests/ci -p test_legacy_manifest_manual.py
          python3 -m unittest discover -s tests/ci -p test_v2_release_event.py
          python3 -m unittest discover -s tests/ci -p test_v2_image_manifest.py
