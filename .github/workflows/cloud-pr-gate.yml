name: Cloud PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: read

concurrency:
  group: cloud-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  v3-platform:
    name: V3 platform configuration
    uses: ./.github/workflows/v3-platform-check.yml
    permissions:
      contents: read

  v3-candidate:
    name: V3 candidate evidence
    uses: ./.github/workflows/v3-candidate-check.yml
    permissions:
      contents: read
      packages: read
      actions: read

  validate:
    name: Release configuration
    runs-on: ubuntu-latest
    outputs:
      runtime_required: ${{ steps.scope.outputs.runtime_required }}
      v2_runtime_required: ${{ steps.scope.outputs.v2_runtime_required }}
      connect_image_required: ${{ steps.scope.outputs.connect_image_required }}
      schema_image_required: ${{ steps.scope.outputs.schema_image_required }}
      outbox_required: ${{ steps.scope.outputs.outbox_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select integration stacks from the PR changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/cloud-pr-scope.py \
            --base "${BASE_SHA}" --head "${HEAD_SHA}" \
            --output "${GITHUB_OUTPUT}" --report "${RUNNER_TEMP}/cloud-pr-scope.json"
          cat "${RUNNER_TEMP}/cloud-pr-scope.json" >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate shell, release and Compose files
        run: bash scripts/validate-cloud-pr.sh

  integration:
    name: Image combination smoke
    needs: validate
    if: needs.validate.outputs.runtime_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR for private release images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify and pull the exact release images
        run: bash scripts/verify-release-images.sh

      - name: Run isolated user-journey smoke
        run: bash tests/ci/run-integration.sh

  v2-integration:
    name: V2 image combination smoke
    needs: validate
    if: needs.validate.outputs.v2_runtime_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR for private V2 images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run isolated V2 image journey
        env:
          V2_CI_RESULTS_DIRECTORY: ${{ runner.temp }}/v2-ci-results
        run: bash tests/ci/v2/run-integration.sh

      - name: Preserve V2 results and diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-image-combination-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v2-ci-results
          retention-days: 7
          if-no-files-found: warn

  v3-connect:
    name: V3 Connect runtime
    needs: validate
    if: needs.validate.outputs.connect_image_required == 'true'
    uses: ./.github/workflows/v3-connect-check.yml
    permissions:
      contents: read

  v3-mysql-schema:
    name: V3 MySQL schema runtime
    needs: validate
    if: needs.validate.outputs.schema_image_required == 'true'
    uses: ./.github/workflows/v3-mysql-schema-check.yml
    permissions:
      contents: read

  v3-outbox:
    name: V3 Outbox CDC runtime
    needs: validate
    if: needs.validate.outputs.outbox_required == 'true'
    uses: ./.github/workflows/v3-outbox-check.yml
    permissions:
      contents: read

  cloud-ci-gate:
    name: cloud-ci-gate
    if: always()
    needs: [validate, integration, v2-integration, v3-platform, v3-connect, v3-mysql-schema, v3-outbox, v3-candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Require validation and applicable integration
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          RUNTIME_REQUIRED: ${{ needs.validate.outputs.runtime_required }}
          V2_INTEGRATION_RESULT: ${{ needs.v2-integration.result }}
          V2_RUNTIME_REQUIRED: ${{ needs.validate.outputs.v2_runtime_required }}
          V3_CANDIDATE_RESULT: ${{ needs.v3-candidate.result }}
          V3_PLATFORM_RESULT: ${{ needs.v3-platform.result }}
          CONNECT_IMAGE_REQUIRED: ${{ needs.validate.outputs.connect_image_required }}
          CONNECT_IMAGE_RESULT: ${{ needs.v3-connect.result }}
          SCHEMA_IMAGE_REQUIRED: ${{ needs.validate.outputs.schema_image_required }}
          SCHEMA_IMAGE_RESULT: ${{ needs.v3-mysql-schema.result }}
          OUTBOX_REQUIRED: ${{ needs.validate.outputs.outbox_required }}
          OUTBOX_RESULT: ${{ needs.v3-outbox.result }}
        run: |
          set -Eeuo pipefail
          [[ "${VALIDATE_RESULT}" == success ]] || exit 1
          [[ "${V3_PLATFORM_RESULT}" == success ]] || exit 1
          [[ "${V3_CANDIDATE_RESULT}" == success ]] || exit 1
          [[ "${RUNTIME_REQUIRED}" == true || "${RUNTIME_REQUIRED}" == false ]] || exit 1
          [[ "${V2_RUNTIME_REQUIRED}" == true || "${V2_RUNTIME_REQUIRED}" == false ]] || exit 1
          if [[ "${RUNTIME_REQUIRED}" == true ]]; then
            [[ "${INTEGRATION_RESULT}" == success ]] || exit 1
          else
            [[ "${INTEGRATION_RESULT}" == skipped ]] || exit 1
          fi
          if [[ "${V2_RUNTIME_REQUIRED}" == true ]]; then
            [[ "${V2_INTEGRATION_RESULT}" == success ]] || exit 1
          else
            [[ "${V2_INTEGRATION_RESULT}" == skipped ]] || exit 1
          fi
          [[ "${CONNECT_IMAGE_REQUIRED}" == true || "${CONNECT_IMAGE_REQUIRED}" == false ]] || exit 1
          if [[ "${CONNECT_IMAGE_REQUIRED}" == true ]]; then
            [[ "${CONNECT_IMAGE_RESULT}" == success ]] || exit 1
          else
            [[ "${CONNECT_IMAGE_RESULT}" == skipped ]] || exit 1
          fi
          [[ "${SCHEMA_IMAGE_REQUIRED}" == true || "${SCHEMA_IMAGE_REQUIRED}" == false ]] || exit 1
          if [[ "${SCHEMA_IMAGE_REQUIRED}" == true ]]; then
            [[ "${SCHEMA_IMAGE_RESULT}" == success ]] || exit 1
          else
            [[ "${SCHEMA_IMAGE_RESULT}" == skipped ]] || exit 1
          fi
          [[ "${OUTBOX_REQUIRED}" == true || "${OUTBOX_REQUIRED}" == false ]] || exit 1
          if [[ "${OUTBOX_REQUIRED}" == true ]]; then
            [[ "${OUTBOX_RESULT}" == success ]] || exit 1
          else
            [[ "${OUTBOX_RESULT}" == skipped ]] || exit 1
          fi
