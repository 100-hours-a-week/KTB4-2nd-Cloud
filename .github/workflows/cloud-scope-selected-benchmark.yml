# Temporary #287 measurement only; remove before merge.
name: Cloud scope selected benchmark

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: read

concurrency:
  group: cloud-scope-selected-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == '287-chore-cloud-pr-gate의-변경-범위별-통합-검증-선택'
    name: selected Release configuration
    runs-on: ubuntu-latest
    outputs:
      runtime_required: ${{ steps.scope.outputs.runtime_required }}
      v2_runtime_required: ${{ steps.scope.outputs.v2_runtime_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Record comparison execution context
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          paths = ['deploy/image-versions.env', 'deploy/v2/image-manifest.json', 'scripts/cloud-pr-scope.py', 'scripts/validate-cloud-pr.sh', 'scripts/verify-release-images.sh', 'tests/ci/run-integration.sh', 'tests/ci/compose.yml', 'tests/ci/smoke.py', 'tests/ci/v2/run-integration.sh', 'tests/ci/v2/compose.yml', 'deploy/v2-staging/kafka/outbox-connector.json']
          cpu = next(line.split(':', 1)[1].strip() for line in Path('/proc/cpuinfo').read_text().splitlines() if line.startswith('model name'))
          memory = next(line for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemTotal:'))
          data = {'checkout': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'cpu': cpu, 'logicalCpu': os.cpu_count(), 'memory': memory, 'architecture': platform.machine(), 'imageOS': os.environ.get('ImageOS'), 'imageVersion': os.environ.get('ImageVersion'), 'hashes': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}}
          print('COMPARISON_CONTEXT=' + json.dumps(data, sort_keys=True))
          PYTHON

      - name: Select the fixed V2 Manifest comparison scenario
        id: scope
        run: |
          python3 - <<'PYTHON'
          import importlib.util
          import json
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('scope', 'scripts/cloud-pr-scope.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          files = ['deploy/v2/image-manifest.json']
          result = module.select(files)
          if 'selected' == 'baseline':
              result['runtime_required'] = True
              result['v2_runtime_required'] = True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              for key in ['runtime_required', 'v2_runtime_required']:
                  stream.write(key + '=' + str(result[key]).lower() + '\n')
          print('SCOPE_EXPERIMENT=' + json.dumps({'mode': 'selected', 'scenario': files, 'decision': result}))
          PYTHON

      - name: Validate shell, release and Compose files
        run: bash scripts/validate-cloud-pr.sh

  integration:
    name: selected Image combination smoke
    needs: validate
    if: needs.validate.outputs.runtime_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record comparison execution context
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          paths = ['deploy/image-versions.env', 'deploy/v2/image-manifest.json', 'scripts/cloud-pr-scope.py', 'scripts/validate-cloud-pr.sh', 'scripts/verify-release-images.sh', 'tests/ci/run-integration.sh', 'tests/ci/compose.yml', 'tests/ci/smoke.py', 'tests/ci/v2/run-integration.sh', 'tests/ci/v2/compose.yml', 'deploy/v2-staging/kafka/outbox-connector.json']
          cpu = next(line.split(':', 1)[1].strip() for line in Path('/proc/cpuinfo').read_text().splitlines() if line.startswith('model name'))
          memory = next(line for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemTotal:'))
          data = {'checkout': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'cpu': cpu, 'logicalCpu': os.cpu_count(), 'memory': memory, 'architecture': platform.machine(), 'imageOS': os.environ.get('ImageOS'), 'imageVersion': os.environ.get('ImageVersion'), 'hashes': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}}
          print('COMPARISON_CONTEXT=' + json.dumps(data, sort_keys=True))
          PYTHON

      - name: Log in to GHCR for private release images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify and pull the exact release images
        run: bash scripts/verify-release-images.sh

      - name: Run isolated user-journey smoke
        run: bash tests/ci/run-integration.sh

      - name: Record pulled image digests
        if: always()
        run: docker image ls --digests --format '{{json .}}'

  v2-integration:
    name: selected V2 image combination smoke
    needs: validate
    if: needs.validate.outputs.v2_runtime_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record comparison execution context
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          paths = ['deploy/image-versions.env', 'deploy/v2/image-manifest.json', 'scripts/cloud-pr-scope.py', 'scripts/validate-cloud-pr.sh', 'scripts/verify-release-images.sh', 'tests/ci/run-integration.sh', 'tests/ci/compose.yml', 'tests/ci/smoke.py', 'tests/ci/v2/run-integration.sh', 'tests/ci/v2/compose.yml', 'deploy/v2-staging/kafka/outbox-connector.json']
          cpu = next(line.split(':', 1)[1].strip() for line in Path('/proc/cpuinfo').read_text().splitlines() if line.startswith('model name'))
          memory = next(line for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemTotal:'))
          data = {'checkout': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'cpu': cpu, 'logicalCpu': os.cpu_count(), 'memory': memory, 'architecture': platform.machine(), 'imageOS': os.environ.get('ImageOS'), 'imageVersion': os.environ.get('ImageVersion'), 'hashes': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}}
          print('COMPARISON_CONTEXT=' + json.dumps(data, sort_keys=True))
          PYTHON

      - name: Log in to GHCR for private V2 images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run isolated V2 image journey
        env:
          V2_CI_RESULTS_DIRECTORY: ${{ runner.temp }}/v2-ci-results
        run: bash tests/ci/v2/run-integration.sh

      - name: Preserve V2 results and diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-image-combination-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v2-ci-results
          retention-days: 7
          if-no-files-found: warn

      - name: Record pulled image digests
        if: always()
        run: docker image ls --digests --format '{{json .}}'

  cloud-ci-gate:
    name: selected cloud-ci-gate
    if: always() && github.head_ref == '287-chore-cloud-pr-gate의-변경-범위별-통합-검증-선택'
    needs: [validate, integration, v2-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require validation and applicable integration
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          RUNTIME_REQUIRED: ${{ needs.validate.outputs.runtime_required }}
          V2_INTEGRATION_RESULT: ${{ needs.v2-integration.result }}
          V2_RUNTIME_REQUIRED: ${{ needs.validate.outputs.v2_runtime_required }}
        run: |
          set -Eeuo pipefail
          [[ "${VALIDATE_RESULT}" == success ]] || exit 1
          [[ "${RUNTIME_REQUIRED}" == true || "${RUNTIME_REQUIRED}" == false ]] || exit 1
          [[ "${V2_RUNTIME_REQUIRED}" == true || "${V2_RUNTIME_REQUIRED}" == false ]] || exit 1
          if [[ "${RUNTIME_REQUIRED}" == true ]]; then
            [[ "${INTEGRATION_RESULT}" == success ]] || exit 1
          else
            [[ "${INTEGRATION_RESULT}" == skipped ]] || exit 1
          fi
          if [[ "${V2_RUNTIME_REQUIRED}" == true ]]; then
            [[ "${V2_INTEGRATION_RESULT}" == success ]] || exit 1
          else
            [[ "${V2_INTEGRATION_RESULT}" == skipped ]] || exit 1
          fi
