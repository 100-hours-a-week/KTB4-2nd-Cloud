name: Retired V2 RunPod URL Update
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Reject retired ECS update path
        run: |
          echo '::error::V2 is retired. Use V3 Production RunPod URL Update after V3 activation.'
          exit 1
