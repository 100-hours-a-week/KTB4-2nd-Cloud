name: V3 Candidate Evidence
on:
  workflow_call:
permissions:
  contents: read
  packages: read
  actions: read
jobs:
  verify:
    name: V3 candidate evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare render tools
        run: |
          set -Eeuo pipefail
          python3 scripts/prepare-v3-validation.py "$RUNNER_TEMP/v3-tools"
          echo "V3_HELM=$RUNNER_TEMP/v3-tools/helm" >> "$GITHUB_ENV"
          echo "V3_KUBECONFORM=$RUNNER_TEMP/v3-tools/kubeconform" >> "$GITHUB_ENV"
          echo "V3_SCHEMA_DIR=$RUNNER_TEMP/v3-tools/schemas" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/v3-venv"
          "$RUNNER_TEMP/v3-venv/bin/pip" install -q -r scripts/requirements-v3-validation.txt
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify complete public candidate and immutable publisher evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/v3-venv/bin/python" scripts/prepare-v3-release-candidate.py --verify-images'
